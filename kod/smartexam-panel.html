<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#4C5FD5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartExam — Müəllim paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F5F9;--card:#FFFFFF;--ink:#17233B;--muted:#5D6880;--line:#DBE1EB;--soft:#EBEFF6;--accent:#2346A6;--accent-ink:#FFFFFF;--pen:#C2362F;--ok:#1F7246;--amber:#A86A00;--hl:#E8C33A;--hl-bg:#FFF6CF;--ok-bg:#E4F2E9;--pen-bg:#FBE8E6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F131B;--card:#171E2C;--ink:#E4E9F2;--muted:#9AA5BA;--line:#2B3548;--soft:#202A3C;--accent:#86A2FF;--accent-ink:#0F131B;--pen:#FF7A6E;--ok:#64CB92;--amber:#E9B44C;--hl:#C9A62B;--hl-bg:#3A3214;--ok-bg:#15301F;--pen-bg:#3B1D1B;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F131B;--card:#171E2C;--ink:#E4E9F2;--muted:#9AA5BA;--line:#2B3548;--soft:#202A3C;--accent:#86A2FF;--accent-ink:#0F131B;--pen:#FF7A6E;--ok:#64CB92;--amber:#E9B44C;--hl:#C9A62B;--hl-bg:#3A3214;--ok-bg:#15301F;--pen-bg:#3B1D1B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--card)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.cloud{background:var(--ok-bg);color:var(--ok)}
.pill.local{background:var(--hl-bg);color:var(--amber)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:none;padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer}
.nav button.on{background:var(--ink);color:var(--card)}
main{max-width:980px;margin:0 auto;padding:16px 14px 30px}
h1{font-size:24px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:14px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.hero{padding:22px 18px;border-left:5px solid var(--pen)}
label.l{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--card);max-width:100%}
textarea{resize:vertical}
.inline{display:flex;gap:8px;align-items:center}
.inline>input,.inline>select{flex:1;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--pen-bg);color:var(--pen)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.pen{font-family:Caveat,"Comic Sans MS",cursive;color:var(--pen);font-weight:700;font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--pen);border-radius:52% 46% 50% 47%;padding:3px 10px 1px;transform:rotate(-4deg);white-space:nowrap}
.pen.big{font-size:40px;padding:4px 16px 2px;border-width:2.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow small{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
details.grp{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--card)}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.grp[open]>summary::after{content:"▴"}
details.grp .inner{padding:0 14px 12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
.grid25{display:grid;grid-template-columns:1fr}
@media (min-width:780px){.grid25{grid-template-columns:1fr 1fr;column-gap:22px}}
.row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-bottom:1px dashed var(--line);border-radius:6px}
.row.flag{background:var(--hl-bg);box-shadow:inset 4px 0 0 var(--hl)}
.qn{width:24px;flex:none;text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center}
.bub{width:36px;height:36px;flex:none;border-radius:50%;border:1.6px solid var(--muted);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;padding:0;cursor:pointer}
.bub.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tfwrap{display:grid;grid-template-columns:auto auto;gap:6px 16px}
.tfi{display:flex;align-items:center;gap:5px}
.tfi i{font-style:normal;color:var(--muted);min-width:30px;font-weight:600;font-size:13px}
.tf .bub{width:32px;height:32px}
.mk{flex:none;min-width:30px;text-align:center;font-weight:800;font-size:15px}
.mk.ok{color:var(--ok)}.mk.bad{color:var(--pen)}.mk.half{color:var(--amber)}
.kh{display:block;font-size:11px;font-weight:700;color:var(--ok);line-height:1}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 0 14px}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.sec{background:var(--soft);border-radius:8px;padding:5px 9px;font-size:13px}
.sec b{font-variant-numeric:tabular-nums}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--muted);border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:650;background:var(--soft)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh;background:var(--soft)}
.preview img{display:block;width:100%;height:auto}
.preview.zoom img{width:200%;max-width:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative}
.thumbs img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--pen);color:#fff;cursor:pointer;font-weight:700;line-height:1}
.status{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:10px;background:var(--soft)}
.status.err{background:var(--pen-bg);color:var(--pen)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.notice{background:var(--hl-bg);border-left:4px solid var(--hl);padding:10px 12px;border-radius:8px;margin:0 0 12px;font-size:14px}
.savebar{position:sticky;bottom:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;box-shadow:0 -6px 18px rgba(15,25,45,.08)}
.savebar .grow{flex:1;font-size:14px}
.crit{border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:8px 0}
.mist{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mist s{color:var(--pen)}
.mist ins{color:var(--ok);text-decoration:none;font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.red i{background:var(--pen)}
.arow{margin:10px 0}
.arow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--pen);color:#fff}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0}
.dlg{background:var(--card);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.ov{align-items:center}.dlg{border-radius:18px}}
.dlg h2{margin-bottom:8px}
footer{text-align:center;padding:20px 14px 30px;color:var(--muted);font-size:13px}
footer a{color:var(--muted)}
#printArea{display:none}
@media print{body::before{display:none}body>*:not(#printArea){display:none!important}#printArea{display:block}:root{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top .who{font-size:12px;color:var(--muted);text-align:right}
.search{position:relative;margin:0 0 12px}
.search input{padding-left:38px}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.big2{grid-template-columns:1fr}}
.shoot{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px;border-radius:14px;border:1.5px dashed var(--muted);background:var(--soft);cursor:pointer;font-weight:700;font-size:16px}
.shoot small{font-weight:500;font-size:13px;color:var(--muted)}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.qitem{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;margin:0 0 8px;border:1px solid var(--line);border-left-width:5px}
.qitem.st-wait{background:var(--soft);border-left-color:var(--muted)}
.qitem.st-busy{background:var(--t1);border-left-color:var(--c1)}
.qitem.st-done{background:var(--ok-bg);border-left-color:var(--ok)}
.qitem.st-need{background:var(--hl-bg);border-left-color:var(--hl)}
.qitem.st-err{background:var(--pen-bg);border-left-color:var(--pen)}
.qcount{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ds{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ds .g{color:var(--ok)}.ds .r{color:var(--pen)}
.qitem:last-child{border-bottom:0}
.qitem img{width:52px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.qitem .grow{flex:1;min-width:0;font-size:14px}
.qitem .grow b{display:block}
.qitem select{margin-top:6px;padding:7px 9px}
.badge{display:inline-block;font-size:12px;font-weight:650;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--hl-bg);color:var(--amber)}
.badge.err{background:var(--pen-bg);color:var(--pen)}
.badge.busy{background:var(--soft);color:var(--accent)}
.pct{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;min-width:62px;text-align:right}
.rank{width:24px;flex:none;color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.li.click{cursor:pointer}
.li.click:hover .grow b{text-decoration:underline}
.excard{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.excard .hd{display:flex;align-items:center;gap:10px}
.excard .hd .grow{flex:1;min-width:0}
.wq{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.wq:last-child{border-bottom:0}
.wq b{display:inline-block;min-width:34px}
.wq .y{color:var(--pen);font-weight:700}
.wq .c{color:var(--ok);font-weight:700}
.crit4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.crit4 div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.crit4 b{display:block;font-size:18px}
.crit4 span{font-size:12px;color:var(--muted)}
.crit4 select{padding:7px 2px 7px 6px;font-size:15px;min-width:0;text-align:center}
.qmeta{display:grid;grid-template-columns:30px 120px 1fr;gap:6px;align-items:center;margin:4px 0}
.qmeta span{font-weight:700;color:var(--muted);text-align:right}
.qmeta select,.qmeta input{padding:7px 8px;font-size:14px}
.cardprev{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardprev img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.cardprev p{margin:4px 0 0;font-size:12px;color:var(--muted);text-align:center}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font-weight:650;padding:0;margin:0 0 12px;cursor:pointer}
.tagrow{display:flex;justify-content:space-between;gap:8px;font-size:14px}

/* ---------- rəngli dizayn ---------- */
:root{--paper:#F3F5FC;--ink:#1B2240;--muted:#5E6785;--line:#E2E6F3;--soft:#EEF1FB;--accent:#4C5FD5;--g1:#4C5FD5;--g2:#7B4FD6;
--t1:#EAF0FF;--c1:#3B5BDB;--t2:#E5F6EC;--c2:#1C8A52;--t3:#FFF1DF;--c3:#C26A00;--t4:#F2EBFF;--c4:#7048E8;--shadow:0 1px 2px rgba(25,35,80,.06),0 6px 18px rgba(25,35,80,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1220;--ink:#E6E9F5;--muted:#9AA3C0;--line:#2A3150;--soft:#1D2440;--accent:#8EA0FF;--card:#161C30;
--t1:#1C2650;--c1:#9DB0FF;--t2:#15301F;--c2:#6BD39A;--t3:#3A2A12;--c3:#F2B45C;--t4:#2A1F4D;--c4:#B9A2FF;--shadow:0 1px 2px rgba(0,0,0,.3)}}
body::before{background:var(--g1)}
.top{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:16px 16px 14px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;line-height:1.15}
.brand::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);font-size:22px;font-weight:800;grid-row:span 2}
.brand small{color:rgba(255,255,255,.82)}
.top .pill{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.top .pill.cloud{background:#1FAE68;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top .pill.cloud::before{content:"☁ ";}
.top .pill.local{background:#F2A93B;color:#2B1C00}
.ck{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.ck.on{background:var(--pen);border-color:var(--pen)}
.li.selon{background:var(--pen-bg);border-radius:10px}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.nav{border-bottom:0;box-shadow:0 2px 10px rgba(25,35,80,.06);padding:8px 10px}
.nav button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 3px 10px rgba(76,95,213,.3)}
.box{border:0;border-radius:18px;box-shadow:var(--shadow)}
.hero{border-left:0;background:linear-gradient(135deg,var(--t1),var(--t4))}
.hero h1{color:var(--c1)}
.stat{border:0;border-radius:16px;box-shadow:var(--shadow)}
.stats .stat:nth-child(1){background:var(--t1)}.stats .stat:nth-child(1) b{color:var(--c1)}
.stats .stat:nth-child(2){background:var(--t2)}.stats .stat:nth-child(2) b{color:var(--c2)}
.stats .stat:nth-child(3){background:var(--t3)}.stats .stat:nth-child(3) b{color:var(--c3)}
.stats .stat:nth-child(4){background:var(--t4)}.stats .stat:nth-child(4) b{color:var(--c4)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 3px 10px rgba(76,95,213,.25)}
.btn.ghost{background:var(--soft);color:var(--c1);box-shadow:none}
.btn.danger{background:var(--pen-bg);color:var(--pen);box-shadow:none}
.btn.wa{background:#1FAA59;box-shadow:0 3px 10px rgba(31,170,89,.25)}
.big2 .shoot:nth-child(1){background:var(--t1);border-color:var(--c1);color:var(--c1)}
.big2 .shoot:nth-child(2){background:var(--t2);border-color:var(--c2);color:var(--c2)}
.shoot{border-width:2px;font-size:17px}
.pct{color:var(--c1)}
.rank{color:var(--c4)}
.bar i{background:linear-gradient(90deg,var(--g1),var(--g2))}
.bar.red i{background:linear-gradient(90deg,#E8590C,var(--pen))}
details.grp{border:0;border-radius:16px;box-shadow:var(--shadow);border-left:5px solid var(--c4)}
.chip.on{background:var(--c1);border-color:var(--c1);color:#fff}
.excard{border:0;background:var(--soft)}
.crit4 div{background:var(--t1)}.crit4 b{color:var(--c1)}
.sec{background:var(--t1)}
.bub.on{background:var(--c1);border-color:var(--c1);color:#fff}
.nav button:not(.on):hover{background:var(--soft)}
footer{color:var(--muted)}
</style>
</head>
<body>
<div class="top"><div class="brand">SmartExam<small>Müəllim paneli</small></div><span id="status" class="pill">Yüklənir…</span></div>
<nav class="nav" id="nav" aria-label="Bölmələr"></nav>

<script type="text/plain" id="rubric-src">Sən 11-ci sinif şagirdlərinin ingilis dilində esse və paraqraflarını yoxlayan təcrübəli müəllimsən. Yazını yalnız aşağıdakı meyarlarla qiymətləndir. Maksimum ümumi bal 5-dir.
Özündən əlavə meyar, səhv sayına əsaslanan cərimə sistemi və ya bal çıxma qaydası yaratma. Ədalətli qiymətləndir: kiçik səhvlərə görə həddindən artıq bal azaltma, meyarlarda nəzərdə tutulmayan əlavə bal vermə.

1. İlkin yoxlama
Əvvəl təqdim edilmiş mövzunun adını və şagirdin yazısını müəyyən et. Mövzu şəkildə və ya istifadəçinin mesajında verilə bilər.
Şagirdin xəttini diqqətlə nəzərdən keçir. Oxuna bilən ifadəni səhv oxuyaraq qrammatik və ya leksik səhv yaratma. Oxuya bilmədiyin sözləri özündən uydurma.
Aşağıdakı hallarda ümumi nəticə 0/5-dir:
- Şagird verilən mövzu əvəzinə başqa mövzuda yazıb.
- Yazı ingilis dilindən başqa dildədir.
- Yazı oxunmur.
Bu hallarda A=0 göstər, B, C və D yoxlanılmır. Oxunmayan yazıda söz sayını uydurma.

2. Söz sayının hesablanması
Şagirdin mətnindəki sözləri diqqətlə və dəqiq say. Mövzunun adını və tapşırığın mətnini şagirdin yazısının söz sayına daxil etmə.

3. Qiymətləndirmə meyarları
A. TAPŞIRIĞIN YERİNƏ YETİRİLMƏSİ — maksimum 1 bal
1 bal:
- Yazı mövzuya uyğundur.
- Minimum 100 sözdür.
- Aydın topic sentence, onu dəstəkləyən fikirlər və yekun fikir var.
- Paraqrafın tərkib hissələri arasında əlaqə tamamilə gözlənilib və mətn axıcıdır.
0.5 bal:
- Mövzu qismən əhatə olunub.
- Yazı 70–99 sözdür.
- Struktur elementləri qismən mövcuddur (tərkib hissələrindən biri yazılıb, məsələn, ya əsas cümlə, ya da dəstəkləyən cümlələr).
- Hissələr arasındakı əlaqə qismən gözlənilib.
100 və daha çox söz olması təkbaşına 1 bal üçün kifayət etmir. Tam balın digər şərtləri tam ödənilmirsə, əsas hissəsinin ödənilməsinə uyğun aşağı səviyyəni seç.
0 bal:
- Fikirlər anlaşılmır və/və ya mövzuya uyğun deyil.
- Yazı 70 sözdən azdır.
- Topic sentence, dəstəkləyici fikirlər və yekun fikir yoxdur.
- Yazı tamamilə şablon və ya əzbər cümlələrdən ibarətdir.
Dayandırma qaydası: A=0 olarsa, B, C və D-ni yoxlama. Ümumi nəticə 0/5-dir.

B. MÖVZUNUN ƏHATƏ EDİLMƏSİ VƏ MƏNTİQİ ARDICILLIQ — maksimum 2 bal
2 bal:
- Ən azı 2 aydın fikir və ya arqument var.
- Fikirlər nümunə və ya ümumi izahla əsaslandırılıb.
- Birləşdirici vasitələrlə cümlələr arasında əlaqə yaradılıb.
- Həm müsbət/lehinə, həm də mənfi/əleyhinə tərəf qeyd olunub.
- Fikirlər arasında məntiqi rabitə var.
1 bal:
- Mövzu əsasən əhatə olunub, lakin arqumentlər məhduddur.
- Ən azı 1 əsaslandırıcı nümunə və ya sübut var.
- Ardıcıllıq var, lakin birləşdirici vasitələr məhduddur.
- Yalnız bir tərəf təqdim olunub və/və ya müəyyən məntiqi kənaraçıxmalar var.
0 bal:
- Yazı 1 balın tələblərinə belə cavab vermir.
Dayandırma qaydası: B=0 olarsa, C və D-ni yoxlama. Ümumi nəticəni yalnız A meyarından alınan bal əsasında göstər.

C. QRAMMATİK QAYDALARA ƏMƏL OLUNMASI — maksimum 1 bal
1 bal:
- Müxtəlif qrammatik forma və sintaktik strukturlardan, sadə və mürəkkəb cümlələrdən düzgün və yerində istifadə olunub.
0.5 bal:
- Yazı əsasən sadə cümlələrdən ibarətdir.
- Qısa, şablon və yarımçıq cümlələr mövcuddur.
- Qrammatik səhvlər bəzən məzmunun çatdırılmasına mane olur.
0 bal:
- Cümlə qurmaqda çətinlik var, yazı əsasən söz yığınından ibarətdir.
- Yazı 0.5 balın tələblərinə cavab vermir.
Qrammatikanın yoxlanması qaydaları:
- Eyni dil qaydasına aid təkrarlanan eyni tip səhvi yalnız 1 səhv hesab et.

D. SÖZ EHTİYATININ MÜXTƏLİFLİYİ VƏ İŞLƏDİLMƏSİ — maksimum 1 bal
1 bal:
- Mövzuya uyğun zəngin söz ehtiyatı var.
- Sözlər düzgün və yerində işlənib.
- Gərəksiz leksik təkrar yoxdur.
- Sinonim, parafraz və söz birləşmələrindən istifadə edilir.
0.5 bal:
- Söz ehtiyatı kifayət qədər müxtəlif deyil.
- Bəzən gərəksiz leksik təkrar var.
0 bal:
- Yazı 0.5 balın tələblərinə cavab vermir.
- Həddindən artıq gərəksiz leksik təkrar var.
Leksikanın yoxlanması qaydaları:
- Sadəcə hərf təkrarını leksik təkrar hesab etmə.
- Yalnız gərəksiz şəkildə təkrarlanan söz və ifadələri leksik təkrar say.
- Şagirdin yazdığı ifadənin həmin kontekstdə işlənməsi mümkündürsə, onu səhv hesab etmə.
- Məsələn, “get a good experience” ifadəsini yalnız “gain valuable experience” daha yaxşı səslənir deyə avtomatik səhv sayma.
- Üslubi təkmilləşdirmə təklifini leksik səhvlə qarışdırma.

Bütün meyarlar üçün ümumi qayda: Hər səviyyənin maksimum balını yalnız həmin səviyyənin şərtləri tam ödənildikdə ver. Şərtlərin əsas hissəsi ödənildikdə uyğun aşağı balı seç. Açıq şəkildə göstərilmiş dayandırma qaydalarını mütləq tətbiq et.

4. Nəticənin hesablanması
Ümumi bal = A + B + C + D. A=0 → ümumi bal 0. B=0 → ümumi bal yalnız A-dan ibarətdir. Yekun bal 0-dan aşağı və 5-dən yuxarı ola bilməz.
Faiz = (100/30) × ümumi bal.</script>
<script type="text/plain" id="rubric9-src">Sən 9-cu sinif şagirdlərinin ingilis dilində, ardıcıl verilmiş 3 şəkil əsasında yazdığı hekayələri yoxlayan qiymətləndirmə köməkçisisən.
Şagirdin yazısını A2 səviyyəsinə uyğun qiymətləndir.
Vacib ilkin yoxlama
Esse qiymətləndirilməzdən əvvəl həm:
1.	Tapşırığa aid 3 ardıcıl şəkil;
2.	Şagirdin yazdığı esse görünməlidir.
Əgər şagird yalnız esseni göndəribsə və tapşırığa aid 3 şəkil görünmürsə, qiymətləndirmə aparma və bal vermə. Şagirddən 3 şəkli də göndərməsini tələb et.
Şəkillər təqdim edildikdən sonra şagirdin hekayəsinin həmin şəkillərə uyğunluğunu ayrıca yoxla.
________________________________________

QİYMƏTLƏNDİRMƏ — maksimum 5 bal
1. Məzmun və tapşırığın yerinə yetirilməsi — 2 bal

Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 2 bal alır:
•	hekayə ardıcıl verilmiş 3 şəklə əsaslanır;
•	hadisələr şəkillərin məzmununa uyğundur;
•	yazı hekayə formasındadır; hekayə daxilində dialoq da ola bilər;
•	şagird yazıya yaradıcı yanaşır;
•	obrazlara ad verə bilər və təxəyyülündən istifadə edə bilər;
•	oxucu hadisənin nə haqqında olduğunu aydın başa düşür və kifayət qədər məlumat əldə edir;
•	yazı 35 söz və ya daha çoxdur.

Aşağıdakı xüsusiyyətlərdən biri və ya bir neçəsi müşahidə olunursa şagird 1 bal alır:
•	yazı əsasən hekayədən çox şəkillərin təsvirindən ibarətdir;
•	obrazlara ad verilsə də hadisələr kifayət qədər inkişaf etdirilməyib;
•	məzmun şəkillərə uyğun olsa da zəif şərh olunub;
•	oxucu hadisə haqqında məhdud məlumat əldə edir;
•	nəzərəçarpacaq dərəcədə mövzudan kənara çıxma və ya məzmun çatışmazlığı vardır;
•	yazı 20–34 sözdür.

Aşağıdakı hallardan biri ciddi şəkildə mövcuddursa şagird 0 bal alır:
•	yazı tamamilə mövzudan kənardır;
•	verilmiş şəkillərə istinad edilmir;
•	yazı anlaşılan hekayə yaratmır və əsasən əlaqəsiz söz/cümlə yığınından ibarətdir;
•	yazı 20 sözdən azdır;
•	əl yazısı qiymətləndirmə aparılmayacaq dərəcədə oxunmazdır.
________________________________________
2. Ardıcıllıq və məntiqi rabitə — 1 bal
Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 1 bal alır:

•	hekayə şəkillərin ardıcıllığına uyğun və başa düşülən formada qurulub;
•	hadisələr və fikirlər arasında məntiqi əlaqə vardır;
•	cümlələr və lazım olduqda abzaslar arasında əlaqə yaradılır;
•	first, then, next, after that, finally, unfortunately, suddenly və s. kimi uyğun əlaqələndirici vasitələrdən istifadə oluna bilər.
Əlaqələndirici sözlərin konkret sayı tələb olunmur. Əsas meyar onların təbii və düzgün istifadəsidir.

Aşağıdakı xüsusiyyətlərdən biri və ya bir neçəsi müşahidə olunursa şagird 0.5 bal alır: 
•	hadisələrin əsas ardıcıllığı qorunur;
•	lakin cümlələr/fikirlər arasındakı əlaqə bəzi yerlərdə zəifdir;
•	əlaqələndirici vasitələr məhduddur və ya eyni vasitələr həddindən artıq təkrarlanır;
•	fikirlər əsasən vergül və digər durğu işarələri vasitəsilə birləşdirilir;
•	buna baxmayaraq, şəkillərə əsaslanan ümumi hadisə ardıcıllığını anlamaq mümkündür.

0 bal
Əgər Yazı 0.5 bal səviyyəsinin tələblərinə belə cavab vermirsə şagird 0 bal alır:
________________________________________
3. Qrammatika — 1 bal
Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 1 bal alır:
•	A2 səviyyəsinə uyğun müxtəlif qrammatik forma və strukturlardan istifadə olunur;
•	sadə cümlələrlə yanaşı ən azı bəzi mürəkkəb/genişləndirilmiş cümlələr də qurulur;
•	and, but, or, so, because, when, while, since və s. kimi bağlayıcılardan uyğun şəkildə istifadə edilir;
•	qrammatik strukturlar ümumilikdə düzgün və yerində işlədilir.
Kiçik qrammatik səhvlərin olması avtomatik olaraq bu meyardan 1 bal almağa mane olmamalıdır. Əsas məsələ şagirdin A2 səviyyəsinə uyğun strukturlardan istifadə edə bilməsidir.
0.5 bal
•	əsasən çox sadə qrammatik strukturlardan istifadə olunur;
•	cümlələr qısa və şablondur;
•	yarımçıq cümlələrə rast gəlinir;
•	mürəkkəb cümlə qurmaq bacarığı çox məhduddur.

Yazı 0.5 bal səviyyəsinin tələblərinə cavab vermirsə şagird 0 bal alır:
________________________________________
4. Söz ehtiyatı — 1 bal
Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 1 bal alır:
•	A2 səviyyəsinə uyğun söz və söz birləşmələrindən yerində istifadə edilir;
•	söz seçimi hekayəni ifadə etməyə imkan verir;
•	həddindən artıq leksik təkrara yol verilmir;
•	orfoqrafiya ümumilikdə düzgündür.
Leksik təkrar dedikdə eyni sözlərin ehtiyac olmadığı halda davamlı təkrar istifadəsi nəzərdə tutulur.
Məsələn:
“Ali was happy. Ali went home. Ali saw his mother. Ali was very happy.”
Əvəzliklərdən, uyğun sinonimlərdən və müxtəlif ifadələrdən istifadə edilməsi daha yaxşı söz ehtiyatının göstəricisidir.

Aşağıdakı xüsusiyyətlərdən biri və ya bir neçəsi müşahidə olunursa şagird 0.5 bal alır: 
•	söz ehtiyatı məhduddur;
•	eyni sözlər tez-tez təkrarlanır;
•	yanlış söz seçimi və ya orfoqrafik səhvlər fikrin ifadəsini çətinləşdirir;
•	lakin yazının əsas mənasını yenə də anlamaq mümkündür.

Yazı 0.5 bal səviyyəsinin tələblərinə cavab vermirsə şagird 0 bal alır: .
________________________________________
CƏRİMƏ
Əvvəlcə yuxarıdakı 4 meyar üzrə balı hesabla. Maksimum nəticə 5 baldır.
Daha sonra leksik, qrammatik və orfoqrafik səhvlərin ümumi sayına əsasən cərimə tətbiq et:
•	0–2 səhv → 0 bal çıx
•	3–5 səhv → 0.5 bal çıx
•	6 və daha çox səhv → 1 bal çıx
Çox vacib qayda
Eyni dil qaydasına aid təkrarlanan eyni tip səhv yalnız 1 səhv hesab olunur.
Məsələn, şagird bir neçə dəfə üçüncü şəxsin təkində -s şəkilçisini buraxıbsa və bunlar eyni qrammatik problemin təkrarıdırsa, cərimənin hesablanmasında bunu ayrı-ayrı səhvlər kimi şişirtmə.
Cəriməni tətbiq etdikdən sonra yekun balı göstər.
Yekun bal 0-dan aşağı ola bilməz və 5-dən yuxarı ola bilməz.
________________________________________

NƏTİCƏNİN HESABLANMASI
Ümumi bal = (A + B + C + D) – Cərimə balı.
Faizi istifadəçinin verdiyi bu düsturla hesabla:
(100/30) × ümumi bal
Məsələn, 3 bal:
(100/30) × 3 = 10%</script>

async function runQueue(){

    it.state='busy';it.msg=it.kind==='back'?wName(examById(it.examId))+' yoxlanılır…':'Cavablar oxunur…';render();

function buildPdf(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let off=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length};
  const obj=(num,body)=>{offs[num]=off;add(`${num} 0 obj\n`);body();add('\nendobj\n')};
  add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add(`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${imgs.length} >>`));
  imgs.forEach((im,i)=>{const p=3+3*i;
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    const cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    obj(p+1,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);add(im.bytes);add('\nendstream')});
  });
  const total=3+3*imgs.length,xref=off;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(off);let p=0;for(const b of parts){out.set(b,p);p+=b.length}return out;
}

/* ---------- AI: question topics ---------- */
async function tagFromPhotos(files){
  if(!sample||!canImages)return toast('Şəkil göndərmək bu görünüşdə mümkün deyil.','err');
  const d=examDraft;d.tagging=true;d.tagMsg='Claude test suallarını oxuyur…';render();
  try{
    const blobs=[];for(const f of files.slice(0,maxImages))blobs.push((await shrink(f,2000)).blob);
    const prompt=`The attached photo(s) show the question pages of a 25-question English exam for school students. Default layout: ${d.type==='9'?'questions 1–4 listening (4 is a True/False set), 5–7 short reading passages, 8–20 grammar and vocabulary (20 is a multiple-selection question), 21–25 one long reading text (25 is a multiple-selection question)':'questions 1–4 listening, 5–17 grammar and vocabulary, 18–21 reading text 1, 22–25 reading text 2; questions 4, 21 and 25 are True/False sets'}.
For each question 1–25, give its section and a short topic tag that a teacher can use to track student weaknesses over the year.
Section must be one of: "Dinləmə", "Oxu", "Qrammatika", "Leksika" (Leksika = vocabulary, word choice, phrasal verbs, collocations, word formation).
Topic: 1–4 words in English, consistent naming, e.g. "Present Perfect", "Passive Voice", "Conditionals", "Prepositions", "Articles", "Phrasal Verbs", "Word Formation", "Reported Speech", "Detail", "Main Idea", "True/False", "Vocabulary in context". For listening questions you cannot hear, use "Listening".
Reply with only JSON: {"questions":[{"n":1,"section":"Dinləmə","topic":"Listening"}, ...25 items]}`;
    const r=await sample.json(prompt,{images:blobs});
    let cnt=0;for(const q of (Array.isArray(r?.questions)?r.questions:[])){const i=Number(q?.n)-1;if(i>=0&&i<N){if(SECS.includes(q.section))d.qmeta[i].sec=q.section;if(q.topic)d.qmeta[i].tag=String(q.topic).slice(0,40);cnt++}}
    d.tagMsg=`${cnt} sualın mövzusu təyin edildi. Yoxlayın və lazım olsa düzəldin.`;d.showMeta=true;
  }catch(e){d.tagMsg=sErr(e)}
  finally{d.tagging=false;render()}
}

function profileData(sid){
  const rs=S.results.filter(r=>r.studentId===sid&&examById(r.examId)).sort((a,b)=>(examById(a.examId).date||'').localeCompare(examById(b.examId).date||''));
  const secs={},tags={},crit={A:[],B:[],C:[],D:[]},errs={};
  const ekind=(rs.slice().reverse().find(r=>r.essay&&r.essay.status==='ok')?.essay.kind)||'';
  for(const r of rs){
    const ex=examById(r.examId);
    if(Array.isArray(r.answers))r.answers.forEach((v,i)=>{const s=qSec(ex,i),p=pointsFor(i,v,ex.key[i]);secs[s]=secs[s]||{got:0,max:0};secs[s].got+=p;secs[s].max++;const t=qTag(ex,i);if(t){const k=s+'|'+t.toLowerCase();tags[k]=tags[k]||{sec:s,tag:t,got:0,max:0,wrong:0};tags[k].got+=p;tags[k].max++;if(p<1)tags[k].wrong++}});
    const e=r.essay;if(e&&e.status==='ok'){if((e.kind||'')===ekind)for(const c of ['A','B','C','D'])if(e[c]!==null&&e[c]!==undefined)crit[c].push(+e[c]);(e.mistakes||[]).forEach(m=>{errs[m.type]=(errs[m.type]||0)+1})}
  }
  const weak=Object.values(tags).filter(t=>t.wrong>0).sort((a,b)=>(a.got/a.max)-(b.got/b.max)||b.wrong-a.wrong).slice(0,8);
  return {rs,secs,weak,crit,errs,ekind};
}

function examCard(r){

function essayHTML(e){
  const wn=e.kind==='9'?'Hekayə':'Paraqraf';
  if(e.status&&e.status!=='ok')return `<h3>${wn}: 0/5</h3><p class="muted">${{off_topic:'Mövzudan kənar yazılıb.',not_english:'İngilis dilində deyil.',unreadable:'Yazı oxunmur.'}[e.status]||''}</p>`;
  const cr=e.kind==='9'?[['A','Məzmun və tapşırığın yerinə yetirilməsi',2],['B','Ardıcıllıq və məntiqi rabitə',1],['C','Qrammatika',1],['D','Söz ehtiyatı',1]]:[['A','Tapşırığın yerinə yetirilməsi',1],['B','Mövzunun əhatə edilməsi',2],['C','Qrammatika',1],['D','Söz ehtiyatı',1]];
  return `<h3>${wn}: ${fmt(e.total??0)}/5${e.words?`, ${e.words} söz`:''}</h3>${cr.map(([k,n,m])=>`<div class="crit"><b>${k}. ${n}: ${e[k]===null||e[k]===undefined?'yoxlanılmadı':fmt(e[k])+'/'+m}</b>${e.comments?.[k]?`<div class="muted" style="font-size:14px">${esc(e.comments[k])}</div>`:''}</div>`).join('')}${e.kind==='9'&&e.A?`<div class="crit" style="border-color:var(--pen)"><b>Cərimə: −${fmt(e.pen||0)}</b><div class="muted" style="font-size:14px">${e.errors??'?'} səhv (0–2 → 0, 3–5 → −0,5, 6+ → −1)</div></div>`:''}
  ${(e.mistakes||[]).length?`<h3>Səhvlər</h3>${e.mistakes.map(m=>`<div class="mist"><s>${esc(m.original)}</s> → <ins>${esc(m.correction)}</ins> <span class="badge">${esc(m.type)}</span><div class="muted">${esc(m.explanation)}</div></div>`).join('')}`:''}
  ${e.feedback?`<h3>Rəy</h3><p>${esc(e.feedback)}</p>`:''}`;
}
function examMsg(r){
  const ex=examById(r.examId),st=studentById(r.studentId),t=resTest(r),e=r.essay,es=resEssay(r);
  const L=[`Salam, ${st?.name||''}!`,`«${ex?.name}» nəticən: ${fmt(resPct(r))}%`,`Cəmi: test ${resTest(r)===null?'–':fmt(resTest(r))}/25 + ${wName(ex).toLocaleLowerCase('az')} ${resEssay(r)===null?'–':fmt(resEssay(r))}/5 = ${totTxt(r)}`];
  if(t!==null){L.push(`Test: ${fmt(t)}/25`);const m=secScores(r);SECS.filter(k=>m[k]).forEach(k=>L.push(`  ${k}: ${fmt(m[k].got)}/${m[k].max}`));
    const w=wrongQs(r);if(w.length){L.push('','Səhv suallar:');w.forEach(q=>L.push(`  ${q.i+1}. ${q.tag?q.tag+' — ':''}sən: ${dispAns(q.v)}, düzgün: ${dispAns(q.k)}`))}}
  if(es!==null){L.push('',`${wName(ex)}: ${fmt(es)}/5`);if(e&&e.status==='ok')L.push(e.kind==='9'?`  Məzmun ${fmt(e.A)}/2, Ardıcıllıq ${e.B===null?'–':fmt(e.B)}/1, Qrammatika ${e.C===null?'–':fmt(e.C)}/1, Söz ehtiyatı ${e.D===null?'–':fmt(e.D)}/1, cərimə −${fmt(e.pen||0)}`:`  A ${fmt(e.A)}/1, B ${e.B===null?'–':fmt(e.B)}/2, C ${e.C===null?'–':fmt(e.C)}/1, D ${e.D===null?'–':fmt(e.D)}/1`);if(e?.feedback)L.push(e.feedback)}
  L.push('',S.settings.sign||S.settings.teacherName||'');
  return L.join('\n').trim();
}
function reportMsg(sid){
  const st=studentById(sid),P=profileData(sid);
  const L=[`Salam! ${st?.name} — ümumi hesabat`,'','Sınaqlar:'];
  P.rs.forEach(r=>L.push(`  ${examById(r.examId).name}: ${fmt(resPct(r))}%`));
  const sk=SECS.filter(k=>P.secs[k]);if(sk.length){L.push('','Bölmələr:');sk.forEach(k=>L.push(`  ${k}: ${Math.round(P.secs[k].got*100/P.secs[k].max)}%`))}
  if(P.weak.length){L.push('','Üzərində işləmək lazım olan mövzular:');P.weak.slice(0,6).forEach(t=>L.push(`  ${t.tag} (${t.sec}): ${t.max} sualdan ${t.wrong}-i səhv`))}
  const er=Object.entries(P.errs).sort((a,b)=>b[1]-a[1]).slice(0,4);if(er.length){L.push('','Paraqrafda tez-tez edilən səhvlər:');er.forEach(([k,v])=>L.push(`  ${k}: ${v}`))}
  L.push('',S.settings.sign||S.settings.teacherName||'');
  return L.join('\n').trim();
}

/* ---------- search ---------- */
function applySearch(inp){
  const q=norm(inp.value);
  document.querySelectorAll('.srow').forEach(el=>{el.hidden=!!q&&!el.dataset.n.includes(q)});
  document.querySelectorAll('details.grp').forEach(d=>{if(q){const any=[...d.querySelectorAll('.srow')].some(r=>!r.hidden);d.hidden=!any;d.open=any}else d.hidden=false});
}

    const rows=[['Şagird','Qrup','Telefon','Test (25)',...SECS,'A','B','C','D','Cərimə','Yazı (5)','Cəmi (30)','Faiz','Səhv suallar']];
    for(const r of rs){const st=studentById(r.studentId),m=secScores(r),e=r.essay||{};rows.push([sName(r.studentId),gName(st?.groupId),st?.phone||'',resTest(r)===null?'':fmt(resTest(r)),...SECS.map(k=>m[k]?fmt(m[k].got)+'/'+m[k].max:''),...['A','B','C','D'].map(k=>e[k]===null||e[k]===undefined?'':fmt(e[k])),e.kind==='9'?fmt(e.pen||0):'',resEssay(r)===null?'':fmt(resEssay(r)),fmt(resTotal(r)),fmt(resPct(r)),wrongQs(r).map(q=>q.i+1).join(' ')])}
    saveFile('netice-'+ex.name.replace(/[^\p{L}\p{N}]+/gu,'-')+'.csv','\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n'));
  },
  async saveSettings(){if(await saveSettings(setDraft)){setDraft=null;render();toast('Yadda saxlanıldı.')}},
  resetRubric(){setDraft.rubric=DEFAULT_RUBRIC;render()},
  resetRubric9(){setDraft.rubric9=DEFAULT_RUBRIC9;render()},
  exportJson(){saveFile('smartexam-ehtiyat-'+today()+'.json',JSON.stringify({app:'SmartExam',version:3,exported:new Date().toISOString(),groups:S.groups,students:S.students,exams:S.exams,results:S.results,settings:S.settings},null,1))},
};
async function importData(v){
  const exams=(v.exams||[]).map(e=>({id:e.id,type:e.type==='9'?'9':'11',pics:e.pics||'',name:e.name,date:e.date||(e.created||'').slice(0,10)||today(),groupIds:e.groupIds||(e.groupId?[e.groupId]:[]),topic:e.topic||'',key:e.key,qmeta:e.qmeta||Array.from({length:N},(_,i)=>({sec:defSec(i,e.type),tag:''})),created:e.created||''})).filter(e=>Array.isArray(e.key)&&e.key.length===N);
  const results=(v.results||[]).map(r=>({...r,answers:Array.isArray(r.answers)?r.answers:(Array.isArray(r.detail)?r.detail.map(d=>String(d.answer||'-')):null),flags:r.flags||[],essay:r.essay&&typeof r.essay.total==='number'?r.essay:null,essayScore:r.essay&&typeof r.essay.total==='number'?undefined:(r.essayScore??undefined)}));
  const all=[['groups',(v.groups||[]).map(g=>({id:g.id,name:g.name}))],['students',(v.students||[]).map(s=>({id:s.id,groupId:s.groupId,name:s.name,phone:s.phone||''}))],['exams',exams],['results',results]];
  const total=all.reduce((s,[,a])=>s+a.length,0);let k=0;
  try{for(const [c,arr] of all)for(const o of arr){if(!o.id)continue;await put(c,o);k++;if(k%10===0)toast(`Bərpa olunur: ${k}/${total}`)}toast(`Bərpa olundu: ${k} qeyd.`)}
  catch(e){toast(`Bərpa yarımçıq qaldı: ${k}/${total}.`,'err')}
  render();
}

/* ---------- events ---------- */
function setBind(path,val){const p=path.split('.');const roots={forms,rf,examDraft,ed,setDraft,Q};let o=roots[p[0]];if(!o)return;for(let i=1;i<p.length-1;i++){o=o[p[i]];if(o==null)return}o[p[p.length-1]]=val}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){sel=null;if(t.dataset.tab==='sinaqlar'&&!(xn.mode==='detail'&&draftDirty())){xn.mode='home';examDraft=freshExam()}if(t.dataset.tab==='parametrler')setDraft=null;go(t.dataset.tab);return}
  const b=e.target.closest('[data-bub]');if(b){tapBubble(b);return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&!e.target.closest('a[href]')){e.preventDefault();ACT[a.dataset.act](a,e)}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.search){applySearch(el);return}if(el.dataset.bind&&el.tagName!=='SELECT')setBind(el.dataset.bind,el.value)});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details.grp')&&d.dataset.g){d.open?openGrp.add(d.dataset.g):openGrp.delete(d.dataset.g)}},true);
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.sname||el.dataset.sphone){
    const s=studentById(el.dataset.sname||el.dataset.sphone);if(!s)return;const v=el.value.trim();
    if(el.dataset.sname){if(!v){el.value=s.name;return toast('Ad boş ola bilməz.','err')}if(v===s.name)return;try{await put('students',{...s,name:v});toast('Saxlanıldı: '+v)}catch(err){}}
    else{if(v===(s.phone||''))return;const d=v.replace(/\D/g,'');try{await put('students',{...s,phone:v});toast(!v?'Nömrə silindi.':d.length<9?'Saxlanıldı, amma nömrə natamam görünür.':'Nömrə saxlanıldı.',v&&d.length<9?'err':'')}catch(err){}}
    return;
  }
  if(el.dataset.qitem){const it=Q.items.find(x=>x.id===el.dataset.qitem);if(it&&el.value){try{await saveItem(it,el.value)}catch(err){}render()}return}
  if(el.dataset.bind&&el.tagName==='SELECT'){setBind(el.dataset.bind,el.value);if(el.dataset.rr)render();return}
  if(!el.dataset.file)return;
  const files=[...(el.files||[])];el.value='';if(!files.length)return;
  const k=el.dataset.file;
  if(k==='front'||k==='back'||k==='sheet')addToQueue(k,files);
  else if(k==='tagphotos')tagFromPhotos(files);
  else if(k==='pics'){try{examDraft.pics=await picsData(files[0]);render()}catch(err){toast('Şəkil açılmadı.','err')}}
  else if(k==='import'){try{const v=JSON.parse(await files[0].text());if(!['groups','students','exams','results'].every(x=>Array.isArray(v[x])))throw new Error('format');if(!await modal({title:'Bərpa edilsin?',html:`<p class="muted">${v.groups.length} qrup, ${v.students.length} şagird, ${v.exams.length} sınaq və ${v.results.length} nəticə əlavə olunacaq. Eyni qeydlər yenilənəcək.</p>`,ok:'Bərpa et'}))return;await importData(v)}catch(err){toast('Fayl uyğun deyil.','err')}}
});
render();
initStore();

</script>
</body>
</html>
