<style>
:root{--paper:#F3F5F9;--card:#FFFFFF;--ink:#17233B;--muted:#5D6880;--line:#DBE1EB;--soft:#EBEFF6;--accent:#2346A6;--accent-ink:#FFFFFF;--pen:#C2362F;--ok:#1F7246;--amber:#A86A00;--hl:#E8C33A;--hl-bg:#FFF6CF;--ok-bg:#E4F2E9;--pen-bg:#FBE8E6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#0F131B;--card:#171E2C;--ink:#E4E9F2;--muted:#9AA5BA;--line:#2B3548;--soft:#202A3C;--accent:#86A2FF;--accent-ink:#0F131B;--pen:#FF7A6E;--ok:#64CB92;--amber:#E9B44C;--hl:#C9A62B;--hl-bg:#3A3214;--ok-bg:#15301F;--pen-bg:#3B1D1B;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;background:var(--card)}
.logo{width:46px;height:46px;flex:none;border-radius:50%;background:linear-gradient(135deg,#2346A6,#7B4FD6);color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px Georgia,"Times New Roman",serif;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 0 0 5px rgba(35,70,166,.9)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;flex:1;min-width:0;cursor:pointer}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.cloud{background:var(--ok-bg);color:var(--ok)}
.pill.local{background:var(--hl-bg);color:var(--amber)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer}
.nav button.on{background:var(--ink);color:var(--card)}
main{max-width:760px;margin:0 auto;padding:16px 14px 30px}
h1{font-size:22px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:16px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
label.l{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--card);max-width:100%}
textarea{resize:vertical}
.inline{display:flex;gap:8px;align-items:center}.inline>input{flex:1;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--pen-bg);color:var(--pen)}
.btn.ok{background:#1F9D55;color:#fff}
.btn.wa{background:#1FAA59;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:15px;flex:1;text-align:center}
.chip small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.85}
.chips.stu .chip{padding:8px 12px;flex:none}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--muted);border-radius:12px;padding:16px;cursor:pointer;font-weight:650;background:var(--soft);position:relative}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn.big{padding:22px;font-size:17px;border-color:var(--accent);color:var(--accent)}
.exam{background:var(--soft);border-radius:12px;padding:12px;margin:14px 0 0}
.exrow{display:flex;gap:12px;align-items:center}
.exrow img{width:110px;height:auto;max-height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.tray{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.tp{position:relative;width:72px;height:92px;border:1px solid var(--line);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center}.tp img{width:100%;height:100%;object-fit:cover;border-radius:8px}.tn{position:absolute;left:4px;bottom:4px;background:#2346A6;color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:1px 6px}.tx{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:none;background:#C2362F;color:#fff;font-weight:700;cursor:pointer;line-height:26px;padding:0}
.qi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi img,.qi .ph{width:44px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;background:var(--soft)}
.qi .grow{flex:1;min-width:0}.qi .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qi .grow small{color:var(--muted);font-size:12.5px}
.qi select{margin-top:6px;padding:7px 9px}
.qi.done{cursor:pointer}.qi.err small{color:var(--pen)}.qi.need small,.qi.need_topic small,.qi.need_pics small{color:var(--amber)}
.status{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.status.err{background:var(--pen-bg);color:var(--pen)}
.ask{background:var(--hl-bg);border-left:4px solid var(--hl);padding:12px;border-radius:10px;margin:12px 0}
.ask b{display:block;margin-bottom:8px}
.notice{background:var(--hl-bg);border-left:4px solid var(--hl);padding:10px 12px;border-radius:8px;margin:0 0 12px;font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pen{font-family:Caveat,"Comic Sans MS",cursive;color:var(--pen);font-weight:700;font-size:46px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--pen);border-radius:52% 46% 50% 47%;padding:4px 18px 2px;transform:rotate(-4deg);white-space:nowrap}
.meta{font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink)}
.arow{margin:12px 0}
.arow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.arow .t span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.arow .cm{font-size:13px;color:var(--muted);margin:4px 0 0}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.low i{background:var(--pen)}.bar.mid i{background:var(--amber)}
.essay{font-size:16px;line-height:1.9;background:var(--soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.essay s{color:var(--pen);text-decoration-thickness:2px;background:var(--pen-bg);border-radius:3px}

<script type="text/plain" id="rubric-src">Sən 11-ci sinif şagirdlərinin ingilis dilində esse və paraqraflarını yoxlayan təcrübəli müəllimsən. Yazını yalnız aşağıdakı meyarlarla qiymətləndir. Maksimum ümumi bal 5-dir.
Özündən əlavə meyar, səhv sayına əsaslanan cərimə sistemi və ya bal çıxma qaydası yaratma. Ədalətli qiymətləndir: meyarlarda nəzərdə tutulmayan əlavə bal vermə.
1. İlkin yoxlama
Əvvəl mövzunun adını və şagirdin yazısını müəyyən et. Mövzu ayrıca verilməyibsə, onu şagirdin yazısından özün müəyyən et və yoxlamaya davam et.
Şagirdin xəttini diqqətlə nəzərdən keçir. Oxuna bilən ifadəni səhv oxuyaraq qrammatik və ya leksik səhv yaratma. Oxuya bilmədiyin sözləri özündən uydurma.
Aşağıdakı hallarda ümumi nəticə 0/5-dir:
•	Şagird verilən mövzu əvəzinə başqa mövzuda yazıb.
•	Yazı ingilis dilindən başqa dildədir.
•	Yazı oxunmur.
Bu hallarda A, B, C və D meyarlarının hamısı 0 olur. Oxunmayan yazıda söz sayını uydurma; “Müəyyən edilmir” göstər.
2. Söz sayının hesablanması
Şagirdin mətnindəki sözləri diqqətlə və dəqiq say. Mövzunun adını və tapşırığın mətnini şagirdin yazısının söz sayına daxil etmə.

3. Qiymətləndirmə meyarları
A. TAPŞIRIĞIN YERİNƏ YETİRİLMƏSİ — maksimum 1 bal
1 bal:
•	Yazı mövzuya uyğundur.
•	Minimum 100 sözdür.
•	Aydın topic sentence, onu dəstəkləyən fikirlər və yekun fikir var.
•	Paraqrafın tərkib hissələri arasında əlaqə tamamilə gözlənilib və mətn axıcıdır.
0.5 bal:
•	Mövzu qismən əhatə olunub.
•	Yazı 70–99 sözdür.
•	Struktur elementləri qismən mövcuddur. (tərkib hissələrindən biri yazılıb (məsələn, ya əsas cümlə, ya da dəstəkləyən cümlələr yazılıb)
•	Hissələr arasındakı əlaqə qismən gözlənilib.

100 və daha çox söz olması təkbaşına 1 bal üçün kifayət etmir. Tam balın digər şərtləri tam ödənilmirsə, əsas hissəsinin ödənilməsinə uyğun aşağı səviyyəni seç.
0 bal:
•	Fikirlər anlaşılmır və/və ya mövzuya uyğun deyil.
•	Yazı 70 sözdən azdır.
•	Topic sentence, dəstəkləyici fikirlər və yekun fikir yoxdur.
•	Yazı tamamilə şablon və ya əzbər cümlələrdən ibarətdir.
Dayandırma qaydası: A=0 olarsa, B, C və D-ni yoxlama. Ümumi nəticə 0/5-dir.



B. MÖVZUNUN ƏHATƏ EDİLMƏSİ VƏ MƏNTİQİ ARDICILLIQ — maksimum 2 bal
2 bal:
•	Ən azı 2 aydın fikir və ya arqument var.
•	Fikirlər nümunə və ya ümumi izahla əsaslandırılıb.
•	Birləşdirici vasitələrlə cümlələr arasında əlaqə yaradılıb.
•	Həm müsbət/lehinə, həm də mənfi/əleyhinə tərəf qeyd olunub.
•	Fikirlər arasında məntiqi rabitə var.
1 bal:
•	Mövzu əsasən əhatə olunub, lakin arqumentlər məhduddur.
•	Ən azı 1 əsaslandırıcı nümunə və ya sübut var.
•	Ardıcıllıq var, lakin birləşdirici vasitələr məhduddur.
•	Yalnız bir tərəf təqdim olunub və/və ya müəyyən məntiqi kənaraçıxmalar var.
0 bal:
•	Yazı 1 balın tələblərinə belə cavab vermir.
Dayandırma qaydası: B=0 olarsa, C və D-ni yoxlama. Ümumi nəticəni yalnız A meyarından alınan bal əsasında göstər.

C. QRAMMATİK QAYDALARA ƏMƏL OLUNMASI — maksimum 1 bal
1 bal:
•	Müxtəlif qrammatik forma və sintaktik strukturlardan, sadə və mürəkkəb cümlələrdən düzgün və yerində istifadə olunub.
0.5 bal:
•	Yazı əsasən sadə cümlələrdən ibarətdir.
•	Qısa, şablon və yarımçıq cümlələr mövcuddur.
•	Qrammatik səhvlər bəzən məzmunun çatdırılmasına mane olur.
0 bal:
•	Cümlə qurmaqda çətinlik var, yazı əsasən söz yığınından ibarətdir.
•	Yazı 0.5 balın tələblərinə cavab vermir.
Qrammatikanın yoxlanması qaydaları:
•	Eyni dil qaydasına aid təkrarlanan eyni tip səhvi yalnız 1 səhv hesab et.

D. SÖZ EHTİYATININ MÜXTƏLİFLİYİ VƏ İŞLƏDİLMƏSİ — maksimum 1 bal
1 bal:
•	Mövzuya uyğun zəngin söz ehtiyatı var.
•	Sözlər düzgün və yerində işlənib.
•	Gərəksiz leksik təkrar yoxdur.
•	Sinonim, parafraz və söz birləşmələrindən istifadə edilir.
0.5 bal:
•	Söz ehtiyatı kifayət qədər müxtəlif deyil.
•	Bəzən gərəksiz leksik təkrar var.
0 bal:
•	Yazı 0.5 balın tələblərinə cavab vermir.
•	Həddindən artıq gərəksiz leksik təkrar var.



Leksikanın yoxlanması qaydaları:
•	Sadəcə hərf təkrarını leksik təkrar hesab etmə.
•	Yalnız gərəksiz şəkildə təkrarlanan söz və ifadələri leksik təkrar say.
•	Şagirdin yazdığı ifadənin həmin kontekstdə işlənməsi mümkündürsə, onu səhv hesab etmə.
•	Məsələn, “get a good experience” ifadəsini yalnız “gain valuable experience” daha yaxşı səslənir deyə avtomatik səhv sayma.
•	Üslubi təkmilləşdirmə təklifini leksik səhvlə qarışdırma.

Bütün meyarlar üçün ümumi qayda: Hər səviyyənin maksimum balını yalnız həmin səviyyənin şərtləri tam ödənildikdə ver. Şərtlərin əsas hissəsi ödənildikdə uyğun aşağı balı seç. Açıq şəkildə göstərilmiş dayandırma qaydalarını mütləq tətbiq et.
4. Nəticənin hesablanması
Normal qiymətləndirmədə:
Ümumi bal = A + B + C + D
Dayandırma qaydaları tətbiq edilərsə:
•	A=0 → ümumi bal 0.
•	B=0 → ümumi bal yalnız A-dan ibarətdir.
Yekun bal 0-dan aşağı və 5-dən yuxarı ola bilməz.</script>
<script type="text/plain" id="rubric9-src">Sən 9-cu sinif şagirdlərinin ingilis dilində, ardıcıl verilmiş 3 şəkil əsasında yazdığı hekayələri yoxlayan qiymətləndirmə köməkçisisən.
Şagirdin yazısını A2 səviyyəsinə uyğun qiymətləndir.
Vacib ilkin yoxlama
Esse qiymətləndirilməzdən əvvəl həm:
1.	Tapşırığa aid 3 ardıcıl şəkil;
2.	Şagirdin yazdığı esse görünməlidir.
Əgər şagird yalnız esseni göndəribsə və tapşırığa aid 3 şəkil görünmürsə, qiymətləndirmə aparma və bal vermə. Şagirddən 3 şəkli də göndərməsini tələb et.
Şəkillər təqdim edildikdən sonra şagirdin hekayəsinin həmin şəkillərə uyğunluğunu ayrıca yoxla.
________________________________________

QİYMƏTLƏNDİRMƏ — maksimum 5 bal
1. Məzmun və tapşırığın yerinə yetirilməsi — 2 bal

Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 2 bal alır:
•	hekayə ardıcıl verilmiş 3 şəklə əsaslanır;
•	hadisələr şəkillərin məzmununa uyğundur;
•	yazı hekayə formasındadır; hekayə daxilində dialoq da ola bilər;
•	şagird yazıya yaradıcı yanaşır;
•	obrazlara ad verə bilər və təxəyyülündən istifadə edə bilər;
•	oxucu hadisənin nə haqqında olduğunu aydın başa düşür və kifayət qədər məlumat əldə edir;
•	yazı 35 söz və ya daha çoxdur.

Aşağıdakı xüsusiyyətlərdən biri və ya bir neçəsi müşahidə olunursa şagird 1 bal alır:
•	yazı əsasən hekayədən çox şəkillərin təsvirindən ibarətdir;
•	obrazlara ad verilsə də hadisələr kifayət qədər inkişaf etdirilməyib;
•	məzmun şəkillərə uyğun olsa da zəif şərh olunub;
•	oxucu hadisə haqqında məhdud məlumat əldə edir;
•	nəzərəçarpacaq dərəcədə mövzudan kənara çıxma və ya məzmun çatışmazlığı vardır;
•	yazı 20–34 sözdür.

Aşağıdakı hallardan biri ciddi şəkildə mövcuddursa şagird 0 bal alır:
•	yazı tamamilə mövzudan kənardır;
•	verilmiş şəkillərə istinad edilmir;
•	yazı anlaşılan hekayə yaratmır və əsasən əlaqəsiz söz/cümlə yığınından ibarətdir;
•	yazı 20 sözdən azdır;
•	əl yazısı qiymətləndirmə aparılmayacaq dərəcədə oxunmazdır.
________________________________________
2. Ardıcıllıq və məntiqi rabitə — 1 bal
Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 1 bal alır:

•	hekayə şəkillərin ardıcıllığına uyğun və başa düşülən formada qurulub;
•	hadisələr və fikirlər arasında məntiqi əlaqə vardır;
•	cümlələr və lazım olduqda abzaslar arasında əlaqə yaradılır;
•	first, then, next, after that, finally, unfortunately, suddenly və s. kimi uyğun əlaqələndirici vasitələrdən istifadə oluna bilər.
Əlaqələndirici sözlərin konkret sayı tələb olunmur. Əsas meyar onların təbii və düzgün istifadəsidir.

Aşağıdakı xüsusiyyətlərdən biri və ya bir neçəsi müşahidə olunursa şagird 0.5 bal alır: 
•	hadisələrin əsas ardıcıllığı qorunur;
•	lakin cümlələr/fikirlər arasındakı əlaqə bəzi yerlərdə zəifdir;
•	əlaqələndirici vasitələr məhduddur və ya eyni vasitələr həddindən artıq təkrarlanır;
•	fikirlər əsasən vergül və digər durğu işarələri vasitəsilə birləşdirilir;
•	buna baxmayaraq, şəkillərə əsaslanan ümumi hadisə ardıcıllığını anlamaq mümkündür.

0 bal

3. Qrammatika — 1 bal
Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 1 bal alır:
•	A2 səviyyəsinə uyğun müxtəlif qrammatik forma və strukturlardan istifadə olunur;
•	sadə cümlələrlə yanaşı ən azı bəzi mürəkkəb/genişləndirilmiş cümlələr də qurulur;
•	and, but, or, so, because, when, while, since və s. kimi bağlayıcılardan uyğun şəkildə istifadə edilir;
•	qrammatik strukturlar ümumilikdə düzgün və yerində işlədilir.
Kiçik qrammatik səhvlərin olması avtomatik olaraq bu meyardan 1 bal almağa mane olmamalıdır. Əsas məsələ şagirdin A2 səviyyəsinə uyğun strukturlardan istifadə edə bilməsidir.
0.5 bal
•	əsasən çox sadə qrammatik strukturlardan istifadə olunur;
•	cümlələr qısa və şablondur;

•	mürəkkəb cümlə qurmaq bacarığı çox məhduddur.

Yazı 0.5 bal səviyyəsinin tələblərinə cavab vermirsə şagird 0 bal alır:

4. Söz ehtiyatı — 1 bal
Aşağıdakı xüsusiyyətlər əsasən təmin olunursa şagird 1 bal alır:
•	A2 səviyyəsinə uyğun söz və söz birləşmələrindən yerində istifadə edilir;
•	söz seçimi hekayəni ifadə etməyə imkan verir;
•	həddindən artıq leksik təkrara yol verilmir;

Leksik təkrar dedikdə eyni sözlərin ehtiyac olmadığı halda davamlı təkrar istifadəsi nəzərdə tutulur.
Məsələn:
“Ali was happy. Ali went home. Ali saw his mother. Ali was very happy.”
Əvəzliklərdən, uyğun sinonimlərdən və müxtəlif ifadələrdən istifadə edilməsi daha yaxşı söz ehtiyatının göstəricisidir.

Aşağıdakı xüsusiyyətlərdən biri və ya bir neçəsi müşahidə olunursa şagird 0.5 bal alır: 
•	söz ehtiyatı məhduddur;
•	eyni sözlər tez-tez təkrarlanır;
•	yanlış söz seçimi və ya orfoqrafik səhvlər fikrin ifadəsini çətinləşdirir;

CƏRİMƏ
Əvvəlcə yuxarıdakı 4 meyar üzrə balı hesabla. Maksimum nəticə 5 baldır.

Çox vacib qayda

Cəriməni tətbiq etdikdən sonra yekun balı göstər.
Yekun bal 0-dan aşağı ola bilməz və 5-dən yuxarı ola bilməz.

<script type="text/plain" id="model11-src">1. GİRİŞ CÜMLƏSİ
Mövzudakı sualı şagirdin mövqeyini bildirən təsdiq cümləsinə çevir və “because” ilə qısa, uyğun səbəb əlavə et.
Nümunə:
“Would you like to have lessons in nature?”
→ “I would like to have lessons in nature because outdoor learning has several benefits.”
“Benefits” və ya “advantages” mövzuya uyğun gəlmirsə, kontekstə uyğun başqa səbəb yaz. “It” və “they” əvəzliklərini aid olduqları sözə uyğun seç.
Giriş cümləsi “I think”, “In my opinion” sözləri ilə başlamasın.

2. BİRİNCİ SƏBƏB VƏ AÇIQLAMA
“Firstly,” və ya “The first reason is that” ilə başla.
Konkret, inandırıcı və mövzu ilə birbaşa əlaqəli səbəb göstər. Ardınca həmin səbəbin necə və ya nə üçün faydalı olduğunu izah et, yaxud nümunə ver.
“For example,”, “because” və ya “so” kimi uyğun vasitələrdən istifadə edə bilərsən.

3. İKİNCİ SƏBƏB VƏ AÇIQLAMA
“Secondly,” və ya “The second important reason is that” ilə başla.
Birinci səbəbdən fərqli, tutarlı ikinci səbəb göstər. Ardınca mütləq açıqlama və ya nümunə əlavə et.
Əvvəlki açıqlamada işlənən keçid ifadəsini təkrarlama. Məsələn, əvvəl “For example” işlənibsə, burada “For instance” seç. Əlaqəyə uyğun olduqda “because” və ya “so” və ya “That is why” istifadə et.

4. QARŞI TƏRƏFİN FİKRİ VƏ AÇIQLAMA
“On the other hand,” və ya “However” ilə başla.
Mövzu üzrə fərqli mövqeyi və onu dəstəkləyən məntiqli səbəbi təqdim et. Qarşı fikir sadəcə qeyd edilməsin, qısa şəkildə əsaslandırılsın.

5. ÖZ MÖVQEYİNİ MÜDAFİƏ
“It might be true, but …” ilə başla.
Qarşı tərəfin narahatlığına konkret cavab ver və əsas mövqeyi müdafiə et. Uyğun həll və ya əsaslandırma göstər. Əvvəlki səbəbləri sadəcə təkrarlama.

6. YEKUN
“In conclusion, I believe that …” ilə başla.
Əsas mövqeyi ümumiləşdir. Giriş cümləsini olduğu kimi təkrarlama və yeni arqument əlavə etmə.

DİL VƏ ÜSLUB
- Paraqraf 100–110 söz arasında olsun.
- Mətn vahid paraqraf şəklində təqdim edilsin; hissələr ayrıca başlıqlara və ya nömrələrə bölünməsin.
- Sadə, aydın, əsasən A2–B1 səviyyəli dil istifadə et.
- Sadə və orta uzunluqlu mürəkkəb cümlələr qur; həddindən artıq uzun və sıx strukturlardan yayın.
- Səbəblər real, konkret və asan əsaslandırılan olsun. Məsələn, təbiətdə dərs mövzusunda təmiz hava almaq və hərəkət imkanının artması kimi səbəblər seçilə bilər.
- Hər iki əsas səbəbin, eləcə də qarşı fikrin açıqlaması olsun.
- Gərəksiz leksik təkrarlardan yayın; təbii sinonim və parafrazlardan istifadə et.
- Təkrardan yayınmaq üçün mənanı dəyişmə və süni ifadələr işlətmə.
- Keçid ifadələrini və bağlayıcıları məntiqi əlaqəyə uyğun seç.
- Struktur ifadələrini və bağlayıcıları qalın şriftlə göstər: **because**, **Firstly**, **For example**, **Secondly**, **For instance**, **On the other hand**, **It might be true, but**, **In conclusion, I believe that**.
- İstifadə edilməyən keçid ifadələrini mətnə məcburi əlavə etmə.</script>
<script type="text/plain" id="model9-src">Şagird esseni düzgün formada görmək istədiyini təsdiqlədikdə:
•	hekayəni A2 səviyyəsində ingilis dilində yenidən yaz;
•	35–50 söz istifadə et (ən çoxu 55 söz — heç vaxt 55-dən çox olmasın);
•	3 şəklin hadisə ardıcıllığını qoru;
•	hekayə formasında yaz;
•	obrazlara uyğun adlar ver;
•	hadisələri məntiqli ardıcıllıqla əlaqələndir;
•	uyğun bağlayıcı və keçid sözlərindən istifadə et;
•	əsasən qısa, sadə cümlələrdən istifadə et; yalnız bir-iki asan bağlı cümlə (and, but, so, because, when) ola bilər; çətin cümlə quruluşları (passiv, şərt cümlələri, uzun tabeli cümlələr, Perfect zamanlar) işlətmə;
•	qrammatika və orfoqrafiyanı düzgün saxla;
•	ilkin hekayənin əsas ideyasını mümkün qədər qoru.
Məqsəd çox yüksək səviyyəli esse yaratmaq deyil. Nümunə real 9-cu sinif A2 şagirdinin yaza biləcəyi səviyyədə olmalıdır.
ƏSAS PRİNSİP
Qiymətləndirmədə şagirdin yazısını ideal və ya B1/B2 səviyyəli ingilis dili ilə müqayisə etmə.
Həmişə A2 səviyyəsini və yuxarıdakı konkret meyarları əsas götür.</script>

function buildPdf(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let off=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length};
  const obj=(num,body)=>{offs[num]=off;add(`${num} 0 obj\n`);body();add('\nendobj\n')};
  add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add(`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${imgs.length} >>`));
  imgs.forEach((im,i)=>{const p=3+3*i;
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    const cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    obj(p+1,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);add(im.bytes);add('\nendstream')});
  });
  const total=3+3*imgs.length,xref=off;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(off);let p=0;for(const b of parts){out.set(b,p);p+=b.length}return out;
}
function paginate(src,brk){
  const W=src.width,H=src.height,PH=Math.round(W*841.89/595.28),M=40,pages=[];const pts=[...new Set(brk.map(Math.round))].filter(v=>v>0&&v<H).sort((a,b)=>a-b);
  let start=0,first=true;
  while(start<H-2){const room=PH-(first?0:M*2);let cut=H;
    if(H-start>room){const ok=pts.filter(v=>v>start+room*.4&&v<=start+room);cut=ok.length?ok[ok.length-1]:start+room}
    const [pg,x]=shareCanvas(W,PH);const dy=first?0:M;x.drawImage(src,0,start,W,cut-start,0,dy,W,cut-start);pages.push(pg);start=cut;first=false}

function waTok(s){return String(s||'').replace(/[*~_`]/g,'').split(/\s+/).filter(Boolean)}
function waDiff(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));

  while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){flush();out.push({eq:a[i]});i++;j++}else if(j<m&&(i>=n||d[i][j+1]>=d[i+1][j]))ins.push(b[j++]);else dl.push(a[i++])}
  flush();return out}
const waBare=t=>t.replace(/[^\p{L}\p{N}']/gu,'');
function waLines(wrong,right){const segs=waDiff(waTok(wrong),waTok(right)),X=[],V=[];
  const P=/[.,!?;:]+$/;

    if(g.del.length&&g.del.length===g.ins.length){let rx=[],rv=[];const fl=()=>{if(rx.length)X.push('~'+rx.join(' ')+'~');if(rv.length)V.push('*'+rv.join(' ')+'*');rx=[];rv=[]};
      g.del.forEach((t,k)=>{const u=g.ins[k];if(waBare(t)===waBare(u)){fl();X.push(t);V.push(u)}else{rx.push(t);rv.push(u)}});fl();return}
    let d=g.del.slice(),n=g.ins.slice(),tail='';
    if(d.length&&n.length){const pd=(d[d.length-1].match(P)||[''])[0],pn=(n[n.length-1].match(P)||[''])[0];if(pd&&pd===pn){d[d.length-1]=d[d.length-1].slice(0,-pd.length);n[n.length-1]=n[n.length-1].slice(0,-pn.length);tail=pd;if(!d[d.length-1])d.pop();if(!n[n.length-1])n.pop()}}
    if(d.length)X.push('~'+d.join(' ')+'~'+(n.length?'':tail));else if(tail&&!n.length)X.push(tail);

  let st=at;while(st>0&&!/[.!?]/.test(tr[st-1]))st--;let en=at+o.length;while(en<tr.length&&!/[.!?]/.test(tr[en-1]||'x'))en++;

function applySearch(inp){
  const q=norm(inp.value);
  document.querySelectorAll('.srow').forEach(el=>{el.hidden=!!q&&!(el.dataset.n||'').includes(q)});
  document.querySelectorAll('details.grp').forEach(d=>{if(q){const any=[...d.querySelectorAll('.srow')].some(r=>!r.hidden);d.hidden=!any;d.open=any}else d.hidden=false});

async function setPics(files){D.picsBusy=true;render();try{const u=await picsData(files.slice(0,3));const o={...S.settings,pics9:u,picsId:newId(),picsDate:new Date().toISOString()};if(!(o.exam9||'').trim())o.exam9='Hekayə · '+today();if(await saveSettings(o)){toast('Şəkillər yadda saxlandı');const pb=picsBlob();requeue(it=>it.state==='need_pics'||(it.state==='wait'&&it.grade==='9'&&!it.pb),it=>{it.pb=pb;it.picsId=o.picsId})}}catch(e){toast('Şəkil açılmadı.','err')}finally{D.picsBusy=false;render()}}
function sendTopic(){const t=(D.askTopic||'').trim();if(!t)return toast('Mövzunun adını yazın.','err');D.topic=t;D.askTopic='';saveSettings({...S.settings,topic11:t});requeue(it=>it.state==='need_topic'||(it.state==='wait'&&it.grade==='11'&&!it.topic),it=>{it.topic=t});const a=document.activeElement;if(a)a.blur();render()}

async function editCheck(c){
  const g=c.grade,cr=CRIT[g];const opt=vals=>[{value:'',label:'–'},...vals.map(v=>({value:String(v),label:fmt(v)}))];
  const fields=[...cr.map(([k,name,mx,vals])=>({label:`${k}. ${name} (/${mx})`,type:'select',value:c[k]==null?'':String(c[k]),options:opt(vals)})),...(g==='9'?[{label:'Cərimə (çıxılır)',type:'select',value:String(c.pen||0),options:[0,.5,1].map(v=>({value:String(v),label:fmt(v)}))}]:[]),{label:'Şagird',type:'select',value:c.studentId,options:[...studentsOf(c.groupId),...S.students.filter(s=>s.groupId!==c.groupId)].map(s=>({value:s.id,label:s.name+' ('+gName(s.groupId)+')'}))}];
  const v=await modal({title:'Balı düzəlt',html:`<p class="hint">${g==='9'?'Məzmun=0 olarsa hekayə 0.':'A=0 olarsa ümumi bal 0, B=0 olarsa yalnız A sayılır.'}</p>`,fields});if(!v)return;
  const o={...c,status:'ok'};cr.forEach(([k],i)=>{o[k]=v[i]===''?null:Number(v[i])});if(o.A===null)o.A=0;if(g==='9')o.pen=Number(v[4]||0);o.studentId=v[v.length-1];
  if(o.A===0){o.B=o.C=o.D=null}else if(g==='11'&&o.B===0){o.C=o.D=null}
  o.total=total5(o);
  const other=S.checks.find(x=>x.id!==o.id&&x.studentId===o.studentId&&tKey(x)===tKey(o));
  if(other&&!await modal({title:'Bu şagirdin nəticəsi var',html:'<p class="muted">Köhnə nəticə bununla əvəz olunsun?</p>',ok:'Əvəz et'}))return;
  try{if(other)await del('checks',other.id);await put('checks',o);toast('Saxlanıldı: '+scTxt(o))}catch(e){}render();
}

async function gradeVocab(it,blobs,np){
  const prompt=`${np>1?`The student's sheet is shown in ${np} parts in order (side 1 first, then side 2${np>2?' and so on':''}); parts may be separate images or stacked top to bottom in one image. Treat them as ONE test.\n`:''}The attached photo${blobs.length>1?'s show':' shows'} a student's vocabulary test sheet. The sheet lists English words (usually numbered; the teacher expects about ${it.total} words). Next to each English word the student has handwritten its translation in Azerbaijani.
Step 1. ${nameStep(it.groupId)}
Step 2. Go through EVERY English word on the sheet in order. For each one, read: the English word exactly as given; any part-of-speech mark next to it (for example "V" or "v" = verb, "n" = noun, "adj" = adjective, "adv" = adverb); and the student's handwritten Azerbaijani answer. Look very closely at each answer, letter by letter, as if zoomed in. Never invent letters or words you cannot see; never turn clear handwriting into a mistake by misreading it.
Step 3. Decide for each answer whether it is correct:
- CORRECT if it is an accepted Azerbaijani translation of the English word in ANY common meaning or common collocation, not only the first dictionary meaning. Synonyms and near-synonyms are fine. Before marking an answer wrong, think about all the ways the English word is used (e.g. "capture": ələ keçirmək, tutmaq, əsir götürmək, and also "capture a photo/moment" = çəkmək / şəklini çəkmək, so "çəkmək" is CORRECT; "run": qaçmaq, idarə etmək; "miss": darıxmaq, qaçırmaq). If the answer fits a real meaning of the word, it is correct.
- When in doubt whether a meaning fits, give the student the benefit of the doubt and mark it CORRECT. Mark WRONG only when the meaning clearly does not fit.
- If a part of speech is marked next to the word, the answer must have that part of speech. Example: "book (V)" is a verb, so it must be translated as a verb ("sifariş etmək", "bron etmək"); the noun meaning "kitab" is then WRONG.
- Spelling mistakes in Azerbaijani are ACCEPTED (a missing or wrong letter, e/ə, i/ı, o/ö, u/ü, missing dots, joined or split words) as long as the word is still clearly recognisable and keeps the same meaning.
- WRONG if the spelling mistake makes it a different word with a different meaning that does not fit the English word; if the meaning is wrong; if the answer is empty; or if it cannot be read at all.
Reply with only JSON:
{"name_as_written":"", "student_number": number from the list or null,
 "items":[{"n":1,"word":"English word","pos":"part-of-speech mark as written, or empty","answer":"the student's answer exactly as written (\\"\\" if empty, \\"?\\" if unreadable)","ok":true,"correct":"the correct Azerbaijani translation (short; for the marked part of speech)","explanation":"only for wrong answers: one short sentence in Azerbaijani explaining why it is wrong (e.g. the student wrote the noun meaning but the word is marked as a verb)"}]}`;
  const o={images:blobs};if(tier)o.modelTier=tier;
  return sample.json(prompt,o);
}
async function processVocab(it){
  const pages=it.pages&&it.pages.length?it.pages:[it.blob];
  const blobs=await fitPages(pages,maxImages);
  const r=await gradeVocab(it,blobs,pages.length);
  const items=(Array.isArray(r?.items)?r.items:[]).slice(0,80).map((x,i)=>({n:Number.isFinite(Number(x?.n))&&x?.n!==null?Number(x.n):i+1,word:String(x?.word||'').slice(0,80),pos:String(x?.pos||'').slice(0,12),answer:String(x?.answer??'').slice(0,120),ok:x?.ok===true,correct:String(x?.correct||'').slice(0,120),explanation:String(x?.explanation||'').slice(0,300)}));
  if(!items.length){it.state='err';it.msg='Sözlər oxunmadı. Daha aydın foto çəkin.';return}
  const total=Math.max(it.total,items.length);
  const v={id:newId(),date:new Date().toISOString(),kind:'vocab',groupId:it.groupId,studentId:'',test:it.test,total,correct:items.filter(x=>x.ok).length,items,written:String(r?.name_as_written||'').slice(0,80)};
  it.payload=v;it.written=v.written;
  const st=it.studentId?studentById(it.studentId):pickStudent(it.groupId,r?.student_number??null,v.written);
  if(!st){it.state='need';it.msg=needMsg(v.written);return}
  await saveV(it,st.id);
}
async function saveV(it,sid){
  const v={...it.payload,studentId:sid};
  const old=S.vchecks.find(x=>x.studentId===sid&&vKey(x)===vKey(v));if(old)v.id=old.id;
  await put('vchecks',v);
  it.state='done';it.checkId=v.id;it.studentId=sid;it.student=sName(sid);it.score=vFull(v);
  it.msg=(old?'🔁 Köhnə nəticə yenisi ilə əvəz olundu. ':'')+'Sözlər: '+vFull(v);
  V.tkey=vKey(v);
}
function vTestsOf(gid){
  const m=new Map();for(const v of S.vchecks.filter(v=>v.groupId===gid)){const k=vKey(v);if(!m.has(k))m.set(k,{key:k,label:v.test,items:[],last:''});const t=m.get(k);t.items.push(v);if(String(v.date)>t.last)t.last=String(v.date)}
  return [...m.values()].sort((a,b)=>b.last.localeCompare(a.last));
}
const vRows=key=>S.vchecks.filter(v=>vKey(v)===key).sort((a,b)=>vPct(b)-vPct(a)||azCmp(sName(a.studentId),sName(b.studentId)));
const vWrong=v=>(v.items||[]).filter(x=>!x.ok);

}
VIEWS.vres=()=>{
  const v=vById(curId);if(!v)return `<button class="back" data-act="back">← Geri</button><div class="box empty">Nəticə tapılmadı.</div>`;
  const st=studentById(v.studentId),href=vHref(v),wr=vWrong(v);
  return `<button class="back" data-act="back">← Geri</button>
  <section class="box"><div class="score"><span class="pen" style="color:${vCol(v)};border-color:${vCol(v)};font-size:26px">${vScTxt(v)}</span><div class="meta"><b>${esc(st?.name||'Şagird')}</b> · ${esc(gName(v.groupId))}<br>${esc(v.test)}<br>${today(v.date)} · <b style="color:${vCol(v)}">${vPct(v)}%</b></div></div>
  <p class="hint" style="margin-top:10px">${wr.length?`${wr.length} söz səhvdir.`:'Bütün sözlər düzdür 👏'} Yoxlamada yanlışlıq varsa, sözə toxunun — düz/səhv dəyişəcək.</p>${(v.items||[]).length<v.total?`<div class="notice">Vərəqdə ${(v.items||[]).length} söz oxundu, imtahan ${v.total} sözlükdür — qalan ${v.total-(v.items||[]).length} söz səhv sayılıb. Foto tam deyilsə, yenidən çəkin.</div>`:''}</section>
  <section class="box"><h2>Sözlər</h2>${vItemsHTML(v)}</section>
  <section class="box"><h2>Şagirdə göndər</h2>
    <div class="acts">${href?`<a class="btn wa" href="${href}" target="_blank" rel="noopener">📤 WhatsApp</a>`:''}<button class="btn ghost" data-act="vCopy" data-id="${v.id}">Mesajı kopyala</button></div>
    ${href?'':`<p class="hint">WhatsApp üçün şagirdin nömrəsini yazın. <button class="btn ghost sm" data-act="editStudent" data-id="${v.studentId}">Nömrə yaz</button></p>`}
    <div class="acts"><button class="btn danger sm" data-act="vDel" data-id="${v.id}">🗑 Sil</button></div></section>`;
};
function vMsg(v){
  const st=studentById(v.studentId),L=[],wr=vWrong(v);
  L.push(`Salam, ${st?.name||''}!`,`«${v.test}» — söz imtahanının nəticəsi:`,'',`Nəticə: *${vScTxt(v)}* · ${vPct(v)}%`);
  if(wr.length){L.push('',`Səhv yazılan sözlər (${wr.length}):`);
    wr.forEach(x=>{const pn=posName(x.pos);const a=String(x.answer||'').replace(/[*~_]/g,'').trim();
      L.push('',`${x.n}. *${x.word.replace(/[*~_]/g,'')}*${x.pos?` (${pn||x.pos})`:''}`);
      L.push(a&&a!=='?'?`❌ Sən yazmısan: ~${a}~`:a==='?'?'❌ Yazdığın oxunmur':'❌ Yazmamısan');
      L.push(`✅ Düzgün cavab: *${String(x.correct).replace(/[*~_]/g,'')}*`);
      if(x.explanation)L.push('💡 '+String(x.explanation).replace(/[*~]/g,''))})}
  else L.push('','Bütün sözlər düzdür 👏');
  const sg=signTxt();if(sg)L.push('',sg);
  return L.join('\n');
}
const vHref=v=>{const ph=waPhone(studentById(v.studentId)?.phone);return ph?`https://wa.me/${ph}?text=${encodeURIComponent(vMsg(v))}`:''};
function vClassImage(key,rs){
  const v0=rs[0]||{},gid=v0.groupId,done=new Set(rs.map(v=>v.studentId)),miss=studentsOf(gid).filter(s=>!done.has(s.id));
  const W=1080,head=170,colHead=64,foot=120,n=rs.length,tot=n+miss.length;
  const rowH=Math.max(36,Math.min(78,Math.floor((1880-head-colHead-foot)/Math.max(1,tot))));
  const H=head+colHead+tot*rowH+foot+40;const [cv,x]=shareCanvas(W,H);
  const last=rs.reduce((m,v)=>String(v.date)>m?String(v.date):m,'');
  shHeader(x,W,head,v0.test||'Söz imtahanı',`${gName(gid)}${String(v0.test||'').includes(today(last||undefined))?'':' · '+today(last||undefined)} · ${n} şagird yazıb${miss.length?` · ${miss.length} yazmayıb`:''}`);
  const fs=Math.max(20,Math.min(34,rowH*.46)),y0=head+colHead;
  x.fillStyle='#EEF1FB';x.fillRect(0,head,W,colHead);
  shTxt(x,'№',40,head+colHead/2,23,700,'#3B4A7A');shTxt(x,'Şagird',100,head+colHead/2,23,700,'#3B4A7A');shTxt(x,'Nəticə',1040,head+colHead/2,23,700,'#3B4A7A','right');
  rs.forEach((v,i)=>{const y=y0+i*rowH,cy=y+rowH/2;if(i%2){x.fillStyle='#F7F8FD';x.fillRect(0,y,W,rowH)}
    shTxt(x,String(i+1),40,cy,fs*.9,700,'#8A94A6');
    shTxt(x,fitTxt(x,sName(v.studentId),600,fs,700),100,cy,fs,700,'#17233B');
    shTxt(x,`${vScTxt(v)} – ${vPct(v)}%`,1040,cy,fs,800,vCol(v),'right')});
  miss.forEach((s,j)=>{const i=n+j,y=y0+i*rowH,cy=y+rowH/2;if(i%2){x.fillStyle='#F7F8FD';x.fillRect(0,y,W,rowH)}
    shTxt(x,String(i+1),40,cy,fs*.9,700,'#8A94A6');
    shTxt(x,fitTxt(x,s.name,620,fs,700),100,cy,fs,700,'#8A94A6');
    const lb='Yazmayıb',bf=Math.max(16,fs*.72);x.font=`700 ${bf}px ${FONT}`;const bw=x.measureText(lb).width+30,bh=Math.min(rowH-10,bf*1.9);
    x.fillStyle='#FBE8E6';x.beginPath();x.roundRect?x.roundRect(1040-bw,cy-bh/2,bw,bh,bh/2):x.rect(1040-bw,cy-bh/2,bw,bh);x.fill();
    shTxt(x,lb,1040-bw/2,cy+1,bf,700,'#C2362F','center')});
  const avg=n?Math.round(rs.reduce((s,v)=>s+vPct(v),0)/n):0,fy=y0+tot*rowH+20;
  x.fillStyle='#F3F5FC';x.fillRect(0,fy,W,foot);shTxt(x,'Sinfin orta nəticəsi',40,fy+foot/2,30,700,'#17233B');shTxt(x,avg+'%',1040,fy+foot/2,40,800,avg>=85?'#1C8A52':avg>=60?'#B7791F':'#C2362F','right');
  shTxt(x,signTxt(),W/2,H-16,20,500,'#8A94A6','center');
  return cv;
}
const VS={cur:'',sent:new Set(),key:''};
const vsKey=()=>'pc2-vsent-'+hash(V.tkey);
function vsLoad(){if(VS.key===vsKey())return;VS.key=vsKey();VS.cur='';try{VS.sent=new Set(JSON.parse(localStorage.getItem(VS.key)||'[]'))}catch(e){VS.sent=new Set()}}
function vsSave(){try{localStorage.setItem(VS.key,JSON.stringify([...VS.sent]))}catch(e){}}
const vsRows=()=>(V.tkey?vRows(V.tkey):[]).sort((a,b)=>azCmp(sName(a.studentId),sName(b.studentId)));
VIEWS.vsend=()=>{
  if(!V.tkey)return `<button class="back" data-act="back">← Geri</button><div class="box empty">Əvvəl imtahanı seçin.</div>`;
  vsLoad();const rs=vsRows(),withPh=rs.filter(v=>waPhone(studentById(v.studentId)?.phone));
  if(!VS.cur||!rs.find(v=>v.id===VS.cur))VS.cur=(withPh.find(v=>!VS.sent.has(v.id))||{}).id||'';
  const done=withPh.filter(v=>VS.sent.has(v.id)).length,noPh=rs.length-withPh.length,cur=rs.find(v=>v.id===VS.cur),v0=rs[0];
  return `<button class="back" data-act="back">← Geri</button>
  <section class="box"><h2>📤 WhatsApp-a göndərmə</h2><p class="muted" style="margin:0 0 8px">${esc(v0?v0.test:'')} · ${esc(v0?gName(v0.groupId):'')}</p>
  <p class="hint">«Göndər» basın → WhatsApp-da göndər oxuna basın → panelə qayıdın. Şagirdin adının qabağına ✅ qoyulur və növbəti şagird avtomatik gəlir.</p>
  <p style="margin:10px 0 0;font-weight:700">Göndərildi: ${done}/${withPh.length}${noPh?` <span class="muted" style="font-weight:500">· ${noPh} şagirdin nömrəsi yoxdur</span>`:''}</p></section>
  ${cur?`<section class="box" style="border:2px solid var(--accent)"><h2>Növbəti: ${esc(sName(cur.studentId))} <span class="sc" style="margin-left:6px;color:${vCol(cur)}">${vFull(cur)}</span></h2><div style="white-space:pre-wrap;font-size:14px;background:var(--soft);border-radius:10px;padding:10px;max-height:240px;overflow:auto">${esc(vMsg(cur))}</div>
  <div class="acts"><a class="btn wa" data-vsent="${cur.id}" href="${vHref(cur)}" target="_blank" rel="noopener">📤 Göndər</a><button class="btn ghost sm" data-act="vsSkip">Keç ›</button></div></section>`:withPh.length?`<section class="box"><p style="margin:0;font-weight:700;color:#1C8A52">✅ Hamısına göndərildi.</p></section>`:''}
  <section class="box"><div class="list">${rs.map((v,i)=>{const st=studentById(v.studentId),ph=waPhone(st?.phone),ok=VS.sent.has(v.id);return `<div class="li${ph?' click':''}${v.id===VS.cur?' selon':''}" ${ph?`data-act="vsPick" data-id="${v.id}"`:''}><span class="rank">${ok?'✅':i+1}</span><div class="grow"><b>${esc(st?.name||'')}</b>${ph?'':`<small style="color:var(--pen)">nömrə yoxdur</small>`}</div>${ph?`<span class="sc" style="color:${vCol(v)}">${vFull(v)}</span>`:`<button class="btn sm ghost" data-act="editStudent" data-id="${st?.id}">Nömrə yaz</button>`}</div>`}).join('')}</div>
  ${done?`<div class="acts"><button class="btn ghost sm" data-act="vsReset">↺ İşarələri sıfırla</button></div>`:''}</section>`;
};
function vProfileBox(sid){
  const rs=S.vchecks.filter(v=>v.studentId===sid).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!rs.length)return '';
  return `<section class="box"><h2>Söz imtahanları</h2><div class="list">${rs.map(v=>`<div class="li click" data-act="openV" data-id="${v.id}"><div class="grow"><b>${esc(v.test)}</b><small>${today(v.date)}</small></div><span class="sc" style="color:${vCol(v)}">${vFull(v)}</span></div>`).join('')}</div></section>`;
}
Object.assign(ACT,{
  openV(el,e){if(e.target.closest('[data-act="vDel"]'))return;curId=el.dataset.id;go('vres')},
  vTotal(el){saveSettings({...S.settings,vtotal:Number(el.dataset.id)}).then(render)},
  async vTotalOther(){const v=await modal({title:'Sözlərin sayı',fields:[{label:'Neçə söz?',value:String(vTotal()),type:'number'}]});if(!v)return;const n=Math.round(Number(v[0]));if(!(n>=1&&n<=80))return toast('1 ilə 80 arasında rəqəm yazın.','err');await saveSettings({...S.settings,vtotal:n});render()},
  async vEnd(){if(!await modal({title:'İmtahan bitsin?',html:'<p class="muted">Nəticələr qalır. Növbəti imtahan üçün yeni ad yazacaqsınız.</p>',ok:'Bəli'}))return;await saveSettings({...S.settings,vtest:''});render()},
  async vToggle(el){const v=vById(el.dataset.id);if(!v)return;const items=v.items.map((x,i)=>i===Number(el.dataset.i)?{...x,ok:!x.ok}:x);const nv={...v,items,correct:items.filter(x=>x.ok).length};try{await put('vchecks',nv);toast(`${items[Number(el.dataset.i)].word}: ${items[Number(el.dataset.i)].ok?'düz':'səhv'} — ${vFull(nv)}`)}catch(e){}render()},
  async vDel(el,e){e.stopPropagation();const v=vById(el.dataset.id);if(!v)return;if(!await confirmBox('Nəticə silinsin?',`${sName(v.studentId)} — ${vFull(v)} (${v.test})`))return;await del('vchecks',v.id);if(tab==='vres')go(prevTab);else render();toast('Silindi')},
  async vDelTest(){const rs=V.tkey?vRows(V.tkey):[];if(!rs.length)return;if(!await confirmBox('Nəticələr silinsin?',`«${rs[0].test}» imtahanının ${rs.length} nəticəsi silinəcək. Bu geri qaytarılmır.`,'Hamısını sil'))return;toast('Silinir…');for(const v of rs)await del('vchecks',v.id);V.tkey='';render();toast('Silindi')},
  vOpenSend:()=>go('vsend'),
  async vClassImg(){const rs=V.tkey?vRows(V.tkey):[];if(!rs.length)return;await fontsReady();try{showImage(vClassImage(V.tkey,rs),safeName('soz-'+gName(rs[0].groupId)+'-'+rs[0].test)+'.png','Sonra WhatsApp-da valideynlər qrupuna göndərin.')}catch(e){toast('Şəkil hazırlanmadı.','err')}},
  async vCopy(el){const v=vById(el.dataset.id);if(!v)return;try{await navigator.clipboard.writeText(vMsg(v));toast('Kopyalandı')}catch(e){toast('Kopyalanmadı.','err')}},
  vsPick(el){VS.cur=el.dataset.id;render();toTop()},
  vsSkip(){const rs=vsRows().filter(v=>waPhone(studentById(v.studentId)?.phone));const i=rs.findIndex(v=>v.id===VS.cur);const nx=rs.slice(i+1).find(v=>!VS.sent.has(v.id))||rs.find(v=>!VS.sent.has(v.id)&&v.id!==VS.cur);VS.cur=nx?nx.id:'';render()},
  async vsReset(){if(!await modal({title:'İşarələr sıfırlansın?',html:'<p class="muted">✅ işarələri silinəcək, göndərmə əvvəldən başlayacaq.</p>',ok:'Bəli'}))return;VS.sent=new Set();vsSave();VS.cur='';render()},
});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-vsent]');if(a){const id=a.dataset.vsent;setTimeout(()=>{VS.sent.add(id);vsSave();VS.cur='';render()},400)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='vtest'){const t=el.value.trim();if(t!==vTestName())saveSettings({...S.settings,vtest:t}).then(()=>scheduleRender());return}
  if(el.dataset&&el.dataset.vsel){V.tkey=el.value;render()}});
render();init();
</script>
