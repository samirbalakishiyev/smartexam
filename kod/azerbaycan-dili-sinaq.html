<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#EA6A12">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azərbaycan dili sınaq yoxlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F5F9;--card:#FFFFFF;--ink:#17233B;--muted:#5D6880;--line:#DBE1EB;--soft:#EBEFF6;--accent:#2346A6;--accent-ink:#FFFFFF;--pen:#C2362F;--ok:#1F7246;--amber:#A86A00;--hl:#E8C33A;--hl-bg:#FFF6CF;--ok-bg:#E4F2E9;--pen-bg:#FBE8E6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F131B;--card:#171E2C;--ink:#E4E9F2;--muted:#9AA5BA;--line:#2B3548;--soft:#202A3C;--accent:#86A2FF;--accent-ink:#0F131B;--pen:#FF7A6E;--ok:#64CB92;--amber:#E9B44C;--hl:#C9A62B;--hl-bg:#3A3214;--ok-bg:#15301F;--pen-bg:#3B1D1B;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F131B;--card:#171E2C;--ink:#E4E9F2;--muted:#9AA5BA;--line:#2B3548;--soft:#202A3C;--accent:#86A2FF;--accent-ink:#0F131B;--pen:#FF7A6E;--ok:#64CB92;--amber:#E9B44C;--hl:#C9A62B;--hl-bg:#3A3214;--ok-bg:#15301F;--pen-bg:#3B1D1B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--card)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.cloud{background:var(--ok-bg);color:var(--ok)}
.pill.local{background:var(--hl-bg);color:var(--amber)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:none;padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer}
.nav button.on{background:var(--ink);color:var(--card)}
main{max-width:980px;margin:0 auto;padding:16px 14px 30px}
h1{font-size:24px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:14px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.hero{padding:22px 18px;border-left:5px solid var(--pen)}
label.l{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--card);max-width:100%}
textarea{resize:vertical}
.inline{display:flex;gap:8px;align-items:center}
.inline>input,.inline>select{flex:1;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--pen-bg);color:var(--pen)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.pen{font-family:Caveat,"Comic Sans MS",cursive;color:var(--pen);font-weight:700;font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--pen);border-radius:52% 46% 50% 47%;padding:3px 10px 1px;transform:rotate(-4deg);white-space:nowrap}
.pen.big{font-size:40px;padding:4px 16px 2px;border-width:2.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow small{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
details.grp{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--card)}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.grp[open]>summary::after{content:"▴"}
details.grp .inner{padding:0 14px 12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
.grid25{display:grid;grid-template-columns:1fr}
@media (min-width:780px){.grid25{grid-template-columns:1fr 1fr;column-gap:22px}}
.row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-bottom:1px dashed var(--line);border-radius:6px}
.row.flag{background:var(--hl-bg);box-shadow:inset 4px 0 0 var(--hl)}
.qn{width:24px;flex:none;text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center}
.bub{width:36px;height:36px;flex:none;border-radius:50%;border:1.6px solid var(--muted);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;padding:0;cursor:pointer}
.bub.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tfwrap{display:grid;grid-template-columns:auto auto;gap:6px 16px}
.tfi{display:flex;align-items:center;gap:5px}
.tfi i{font-style:normal;color:var(--muted);min-width:30px;font-weight:600;font-size:13px}
.tf .bub{width:32px;height:32px}
.mk{flex:none;min-width:30px;text-align:center;font-weight:800;font-size:15px}
.mk.ok{color:var(--ok)}.mk.bad{color:var(--pen)}.mk.half{color:var(--amber)}
.kh{display:block;font-size:11px;font-weight:700;color:var(--ok);line-height:1}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 0 14px}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.sec{background:var(--soft);border-radius:8px;padding:5px 9px;font-size:13px}
.sec b{font-variant-numeric:tabular-nums}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--muted);border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:650;background:var(--soft)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh;background:var(--soft)}
.preview img{display:block;width:100%;height:auto}
.preview.zoom img{width:200%;max-width:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative}
.thumbs img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--pen);color:#fff;cursor:pointer;font-weight:700;line-height:1}
.status{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:10px;background:var(--soft)}
.status.err{background:var(--pen-bg);color:var(--pen)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.notice{background:var(--hl-bg);border-left:4px solid var(--hl);padding:10px 12px;border-radius:8px;margin:0 0 12px;font-size:14px}
.savebar{position:sticky;bottom:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;box-shadow:0 -6px 18px rgba(15,25,45,.08)}
.savebar .grow{flex:1;font-size:14px}
.crit{border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:8px 0}
.mist{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mist s{color:var(--pen)}
.mist ins{color:var(--ok);text-decoration:none;font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.red i{background:var(--pen)}
.arow{margin:10px 0}
.arow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--pen);color:#fff}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0}
.dlg{background:var(--card);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.ov{align-items:center}.dlg{border-radius:18px}}
.dlg h2{margin-bottom:8px}
footer{text-align:center;padding:20px 14px 30px;color:var(--muted);font-size:13px}
footer a{color:var(--muted)}
#printArea{display:none}
@media print{body::before{display:none}body>*:not(#printArea){display:none!important}#printArea{display:block}:root{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top .who{font-size:12px;color:var(--muted);text-align:right}
.search{position:relative;margin:0 0 12px}
.search input{padding-left:38px}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.big2{grid-template-columns:1fr}}
.shoot{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px;border-radius:14px;border:1.5px dashed var(--muted);background:var(--soft);cursor:pointer;font-weight:700;font-size:16px}
.shoot small{font-weight:500;font-size:13px;color:var(--muted)}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.qitem{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;margin:0 0 8px;border:1px solid var(--line);border-left-width:5px}
.qitem.st-wait{background:var(--soft);border-left-color:var(--muted)}
.qitem.st-busy{background:var(--t1);border-left-color:var(--c1)}
.qitem.st-done{background:var(--ok-bg);border-left-color:var(--ok)}
.qitem.st-need{background:var(--hl-bg);border-left-color:var(--hl)}
.qitem.st-err{background:var(--pen-bg);border-left-color:var(--pen)}
.qcount{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ds{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ds .g{color:var(--ok)}.ds .r{color:var(--pen)}
.qitem:last-child{border-bottom:0}
.qitem img{width:52px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.qitem .grow{flex:1;min-width:0;font-size:14px}
.qitem .grow b{display:block}
.qitem select{margin-top:6px;padding:7px 9px}
.badge{display:inline-block;font-size:12px;font-weight:650;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--hl-bg);color:var(--amber)}
.badge.err{background:var(--pen-bg);color:var(--pen)}
.badge.busy{background:var(--soft);color:var(--accent)}
.pct{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;min-width:62px;text-align:right}
.rank{width:24px;flex:none;color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.li.click{cursor:pointer}
.li.click:hover .grow b{text-decoration:underline}
.excard{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.excard .hd{display:flex;align-items:center;gap:10px}
.excard .hd .grow{flex:1;min-width:0}
.wq{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.wq:last-child{border-bottom:0}
.wq b{display:inline-block;min-width:34px}
.wq .y{color:var(--pen);font-weight:700}
.wq .c{color:var(--ok);font-weight:700}
.crit4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.crit4 div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.crit4 b{display:block;font-size:18px}
.crit4 span{font-size:12px;color:var(--muted)}
.crit4 select{padding:7px 2px 7px 6px;font-size:15px;min-width:0;text-align:center}
.qmeta{display:grid;grid-template-columns:30px 120px 1fr;gap:6px;align-items:center;margin:4px 0}
.qmeta span{font-weight:700;color:var(--muted);text-align:right}
.qmeta select,.qmeta input{padding:7px 8px;font-size:14px}
.cardprev{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardprev img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.cardprev p{margin:4px 0 0;font-size:12px;color:var(--muted);text-align:center}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font-weight:650;padding:0;margin:0 0 12px;cursor:pointer}
.tagrow{display:flex;justify-content:space-between;gap:8px;font-size:14px}

/* ---------- rəngli dizayn ---------- */
:root{--paper:#F3F5FC;--ink:#1B2240;--muted:#5E6785;--line:#E2E6F3;--soft:#EEF1FB;--accent:#EA6A12;--g1:#EA6A12;--g2:#F59E0B;
--t1:#FFF1E6;--c1:#C2510A;--t2:#E5F6EC;--c2:#1C8A52;--t3:#FFF1DF;--c3:#C26A00;--t4:#F2EBFF;--c4:#7048E8;--shadow:0 1px 2px rgba(25,35,80,.06),0 6px 18px rgba(25,35,80,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1220;--ink:#E6E9F5;--muted:#9AA3C0;--line:#2A3150;--soft:#1D2440;--accent:#FDBA74;--card:#161C30;
--t1:#3A2210;--c1:#FDBA74;--t2:#15301F;--c2:#6BD39A;--t3:#3A2A12;--c3:#F2B45C;--t4:#2A1F4D;--c4:#B9A2FF;--shadow:0 1px 2px rgba(0,0,0,.3)}}
body::before{background:var(--g1)}
.top{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:16px 16px 14px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;line-height:1.15}
.brand::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);font-size:22px;font-weight:800;grid-row:span 2}
.brand small{color:rgba(255,255,255,.82)}
.top .pill{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.top .pill.cloud{background:#1FAE68;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top .pill.cloud::before{content:"☁ ";}
.top .pill.local{background:#F2A93B;color:#2B1C00}
.ck{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.ck.on{background:var(--pen);border-color:var(--pen)}
.li.selon{background:var(--pen-bg);border-radius:10px}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.nav{border-bottom:0;box-shadow:0 2px 10px rgba(25,35,80,.06);padding:8px 10px}
.nav button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 3px 10px rgba(234,106,18,.3)}
.box{border:0;border-radius:18px;box-shadow:var(--shadow)}
.hero{border-left:0;background:linear-gradient(135deg,var(--t1),var(--t4))}
.hero h1{color:var(--c1)}
.stat{border:0;border-radius:16px;box-shadow:var(--shadow)}
.stats .stat:nth-child(1){background:var(--t1)}.stats .stat:nth-child(1) b{color:var(--c1)}
.stats .stat:nth-child(2){background:var(--t2)}.stats .stat:nth-child(2) b{color:var(--c2)}
.stats .stat:nth-child(3){background:var(--t3)}.stats .stat:nth-child(3) b{color:var(--c3)}
.stats .stat:nth-child(4){background:var(--t4)}.stats .stat:nth-child(4) b{color:var(--c4)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 3px 10px rgba(234,106,18,.25)}
.btn.ghost{background:var(--soft);color:var(--c1);box-shadow:none}
.btn.danger{background:var(--pen-bg);color:var(--pen);box-shadow:none}
.btn.wa{background:#1FAA59;box-shadow:0 3px 10px rgba(31,170,89,.25)}
.big2 .shoot:nth-child(1){background:var(--t1);border-color:var(--c1);color:var(--c1)}
.big2 .shoot:nth-child(2){background:var(--t2);border-color:var(--c2);color:var(--c2)}
.shoot{border-width:2px;font-size:17px}
.pct{color:var(--c1)}
.rank{color:var(--c4)}
.bar i{background:linear-gradient(90deg,var(--g1),var(--g2))}
.bar.red i{background:linear-gradient(90deg,#E8590C,var(--pen))}
details.grp{border:0;border-radius:16px;box-shadow:var(--shadow);border-left:5px solid var(--c4)}
.chip.on{background:var(--c1);border-color:var(--c1);color:#fff}
.excard{border:0;background:var(--soft)}
.crit4 div{background:var(--t1)}.crit4 b{color:var(--c1)}
.sec{background:var(--t1)}
.bub.on{background:var(--c1);border-color:var(--c1);color:#fff}
.nav button:not(.on):hover{background:var(--soft)}
footer{color:var(--muted)}
.cardprev{grid-template-columns:1fr 1fr}
.qitem img+img{margin-left:-4px}
</style>

<script type="text/plain" id="rubric-src">AÇIQ TAPŞIRIQLARIN QİYMƏTLƏNDİRİLMƏ MEYARLARI (bal şkalası)
Hər açıq tapşırıq 1 / ½ / 0 bal şkalası ilə qiymətləndirilir (proqramda: 1 bal = 2 xal, ½ bal = 1 xal, 0 = 0).

1. Sözlərin qarşılığını (kontekstdəki mənasını) yazmaq (adətən 3 söz):
1 bal — a. Hər üç sözün qarşılığı düzgün yazılır, yanlış nümunə yazılmır.
½ bal — b. İki sözün qarşılığı düzgün yazılır, bir sözün qarşılığı yazılmır.
½ bal — c. İki sözün qarşılığı düzgün yazılır, bir sözün qarşılığı yanlış yazılır.
0 bal — d. Digər hallarda.

2. Cümlələri zənginləşdirmək / üslubi xüsusiyyətlərə uyğun yenidən yazmaq (məcazi ifadələrlə):
1 bal — a. Cümlələrdə uyğun düzəliş edilir, yanlış qeyd yazılmır.
½ bal — b. Cümlələrdə uyğun düzəliş edilsə də, bir yanlış qeyd də yazılır.
½ bal — c. Cümlələrdən birində uyğun düzəliş edilir, yanlış qeyd yazılmır.
0 bal — d. Digər hallarda.

3. Nöqtələrin (boşluqların) yerinə uyğun ifadələr yazmaq (adətən 2 boşluq):
1 bal — a. Hər iki boşluğa uyğun fikirlər yazılır, yanlış fikirlər yazılmır.
½ bal — b. Hər iki boşluğa uyğun fikirlər yazılsa da, bir yanlış fikir də yazılır.
½ bal — c. Bir boşluğa uyğun fikir yazılır, bir boşluqsa yazılmır.
0 bal — d. Digər hallarda.

4. Cədvəli tamamlamaq (sözün mətndənkənar mənası, ifadənin funksiyası, müddəa və faktlar və s.):
1 bal — a. Cədvəlin hər boş hissəsinə uyğun nümunə yazılır, yanlış nümunə yazılmır.
½ bal — b. Hər hissəyə uyğun nümunə yazılsa da, yanlış nümunə də yazılır.
½ bal — c. Yalnız iki hissəyə uyğun nümunə yazılır, yanlış nümunə yazılmır.
0 bal — d. Digər hallarda.

5. Cümlədə uyğun düzəlişlər etməklə (yalnız qüsurlu məqamlarda) cümləni yenidən yazmaq:
1 bal — a. Cümlədə uyğun düzəliş edilir, yanlış qeyd yazılmır.
½ bal — b. Cümlədə uyğun düzəliş edilsə də, bir yanlış qeyd də yazılır.
0 bal — d. Digər hallarda.

6. Fikri təsdiq edən iki fakt / üsluba aid iki xüsusiyyət və s. yazmaq:
1 bal — a. İki uyğun fikir yazılır, yanlış fikir yazılmır.
½ bal — b. İki uyğun fikir yazılsa da, yanlış fikir də yazılır.
½ bal — c. Bir uyğun fikir yazılır, yanlış fikir yazılmır.
0 bal — d. Digər hallarda.

7. Müddəa və faktlar cədvəli — QEYDLƏR:
- Müddəada ən azından səsin yazılması və ya eşitdirilməsi (yəni mətnin əsas mövzusu) vurğulanmalıdır.
- Müddəa ancaq nəqli cümlə ilə yazılmalıdır.
- Müddəa cümlə ilə yazılmadıqda "0" balla qiymətləndirilir.
- Faktlar düz, müddəa yanlış olsa, "0" balla qiymətləndirilir.
- Müddəa düz, faktlardan biri düz və ya biri düz, digəri səhv olarsa, "yarımballa" qiymətləndirilir.

ÜMUMİ QAYDALAR:
- Müəllimin verdiyi doğru cavablar nümunədir. Şagirdin cavabı nümunədə olmasa da, Azərbaycan ədəbi dilinin normalarına, sözün izahlı lüğətdəki mənalarına və mətnin kontekstinə uyğundursa, düzgün sayılır və bu, izahla qeyd olunur.
- Orfoqrafiya/durğu işarəsi tapşırığın mövzusu deyilsə, kiçik yazı səhvlərinə görə cavab yanlış sayılmır.
</script>

function buildPdf(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let off=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length};
  const obj=(num,body)=>{offs[num]=off;add(`${num} 0 obj\n`);body();add('\nendobj\n')};
  add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add(`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${imgs.length} >>`));
  imgs.forEach((im,i)=>{const p=3+3*i;
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    const cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    obj(p+1,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));

}

}

  const w=norm(written);if(!w)return null;const wt=w.split(' ');

function resMsg(r){
  const ex=examById(r.examId),st=studentById(r.studentId),cq=closedQs(ex),L=[`Salam, ${st?.name||''}!`,`«${ex?.name||''}» sınağının nəticəsi:`,`Qapalı: ${closedScore(r,ex)}/${cq.length}`,`Açıq: ${openScore(r)}/${openQs(ex).length*2}`,`*Bal: ${fmt(pctOf(r))}/100*`];
  const wq=cq.map((q,i)=>({q,v:(r.answers||[])[i]})).filter(({q,v})=>!(v&&v!=='-'&&String(q.key||'').includes(v)));
  L.push('',wq.length?'*Səhv qapalı suallar:*':'Qapalı suallarda səhv yoxdur 👏',...wq.map(({q,v})=>`${q.n}) sənin: ${v&&v!=='-'?v:'boş'} → düzgün: ${q.key||'?'}`));
  const oq=openQs(ex);if(oq.length){L.push('','📝 *Açıq suallar:*');(r.open||[]).forEach(o=>{const q=oq.find(z=>z.n===o.n);L.push('',`*${o.n}) ${q?.hint||''}: ${ptsTxt(o.score)}*`);if(o.answer)L.push(`Sənin cavabın: ${o.answer}`);if(o.note)L.push(`💡 ${o.note}`)})}
  const sg=S.settings.sign||S.settings.teacherName||'';if(sg)L.push('',sg);
  return L.join('\n').replace(/[~]/g,'');
}
function classImage(ex,gid,rs,absent){
  const W=1080,head=170,colHead=64,foot=120,n=rs.length,N=n+absent.length,rowH=Math.max(36,Math.min(78,Math.floor((1880-head-colHead-foot)/Math.max(1,N))));
  const H=head+colHead+N*rowH+foot+20;const [c,x]=shareCanvas(W,H);
  shHeader(x,W,head,ex.name,`${gName(gid)} · ${ex.date||''} · ${N} şagird${absent.length?' · '+absent.length+' yazmayıb':''}`);
  const fs=Math.max(20,Math.min(34,rowH*.46)),y0=head+colHead;
  x.fillStyle='#EEF1FB';x.fillRect(0,head,W,colHead);[[40,'№','left'],[100,'Şagird','left'],[640,'Qapalı','center'],[800,'Açıq','center'],[1040,'Bal','right']].forEach(([px,t,a])=>shTxt(x,t,px,head+colHead/2,23,700,'#3B4A7A',a));
  rs.forEach((r,i)=>{const y=y0+i*rowH,cy=y+rowH/2;if(i%2){x.fillStyle='#F7F8FD';x.fillRect(0,y,W,rowH)}shTxt(x,String(i+1),40,cy,fs*.9,700,'#8A94A6');let nm=sName(r.studentId);x.font=`700 ${fs}px Inter, Arial, sans-serif`;while(x.measureText(nm).width>470&&nm.length>3)nm=nm.slice(0,-2)+'…';shTxt(x,nm,100,cy,fs,700,'#17233B');
    shTxt(x,closedScore(r,ex)+'/'+closedQs(ex).length,640,cy,fs,600,'#17233B','center');shTxt(x,openScore(r)+'/'+openQs(ex).length*2,800,cy,fs,600,'#17233B','center');const p=pctOf(r);shTxt(x,fmt(p),1040,cy,fs,800,pctCol(p),'right')});
  absent.forEach((st,k)=>{const i=n+k,y=y0+i*rowH,cy=y+rowH/2;if(i%2){x.fillStyle='#F7F8FD';x.fillRect(0,y,W,rowH)}shTxt(x,String(i+1),40,cy,fs*.9,700,'#8A94A6');shTxt(x,st.name||'',100,cy,fs,700,'#8A94A6');shTxt(x,'Yazmayıb',1040,cy,fs,700,'#C2362F','right')});
  const avg=n?rs.reduce((a,r)=>a+pctOf(r),0)/n:0,fy=y0+N*rowH+20;x.fillStyle='#F3F5FC';x.fillRect(0,fy,W,foot);shTxt(x,'Sinfin orta balı',40,fy+foot/2,30,700,'#17233B');shTxt(x,fmt(Math.round(avg*100)/100)+' / 100',1040,fy+foot/2,40,800,pctCol(avg),'right');
  shTxt(x,S.settings.sign||S.settings.teacherName||'',W/2,H-14,20,500,'#8A94A6','center');return c;
}

/* ---------- views ---------- */
function topNotes(){return mode==='local'?`<div class="notice">Məlumatlar yalnız bu brauzerdə saxlanır.</div>`:''}
VIEWS.yoxla=()=>{
  const exs=examsSorted().filter(e=>(e.qs||[]).length);
  if(!exs.length)return topNotes()+`<section class="box hero"><h1>Azərbaycan dili — sınaq yoxlama</h1><p class="muted">Əvvəl «Sınaqlar» bölməsində sınaq yaradın: sualların PDF-ini yükləyin, qapalı sualların açarını yazın, cavab kartını çap edin.</p><div class="acts"><button class="btn" data-act="go" data-to="sinaqlar">Sınaq yarat</button><button class="btn ghost" data-act="go" data-to="sagirdler">Şagirdləri əlavə et</button></div></section>`;
  if(!exs.some(e=>e.id===Q.examId))Q.examId=exs[0].id;
  const ex=examById(Q.examId),gs=groupsSorted();if(!groupById(Q.groupId))Q.groupId=exGroups(ex)[0]||gs[0]?.id||'';
  const sts=studentsOf(Q.groupId),done=S.results.filter(r=>r.examId===ex.id&&studentById(r.studentId)?.groupId===Q.groupId).length;
  const items=Q.items.filter(x=>x.examId===ex.id).slice().reverse(),two=splitOpen(ex)[1].length>0;
  const b={wait:'<span class="badge">⏳ növbədə</span>',busy:'<span class="badge busy">🔄 yoxlanır</span>',done:'<span class="badge ok">✅ hazır</span>',need:'<span class="badge warn">şagirdi seçin</span>',err:'<span class="badge err">xəta</span>'};
  return topNotes()+`<section class="box"><h2>Hansı sınağı yoxlayırıq?</h2><div class="two"><div><label class="l" style="margin-top:0">Sınaq</label><select data-bind="Q.examId" data-rr="1">${exs.map(x=>`<option value="${x.id}"${x.id===Q.examId?' selected':''}>${esc(x.name)}${x.date?' ('+esc(x.date)+')':''}</option>`).join('')}</select></div>
  <div><label class="l" style="margin-top:0">Qrup</label><select data-bind="Q.groupId" data-rr="1">${gs.length?gs.map(g=>`<option value="${g.id}"${g.id===Q.groupId?' selected':''}>${esc(g.name)}</option>`).join(''):'<option value="">Qrup yoxdur</option>'}</select></div></div>
  <p class="hint">${closedQs(ex).length} qapalı + ${openQs(ex).length} açıq sual · ${esc(gName(Q.groupId))}: yoxlanıb ${done}/${sts.length}.</p>
  ${!canImages?`<div class="notice">Foto oxuma bu görünüşdə işləmir.</div>`:''}
  <label class="shoot" for="pk-sheet" style="width:100%">📷 Cavab kartlarının şəkli<small>${two?'Hər şagird üçün 2 şəkil — əvvəl 1-ci, sonra 2-ci səhifə (ardıcıl seçin). Bir neçə şagirdi birdən seçə bilərsiniz.':'Hər şəkildə bir şagirdin kartı.'}</small></label>
  <p class="hint">Vərəq bütövlükdə kadrda olsun, işıq yaxşı düşsün. Şagirdin adı kartdan oxunur.</p>
  <div class="acts"><button class="btn sm" data-act="card" data-id="${ex.id}">📄 Cavab kartı (PDF)</button><button class="btn sm ghost" data-act="toRes" data-id="${ex.id}">📊 Nəticələr</button>${Q.paused&&Q.items.some(x=>x.state==='wait')?`<button class="btn sm" data-act="resume">Davam et</button>`:''}</div></section>
  ${items.length?`<section class="box"><h2>Yoxlanan kartlar</h2>${items.map(it=>`<div class="qitem st-${it.state}"><img src="${it.thumb}" alt="">${it.thumb2?`<img src="${it.thumb2}" alt="">`:''}<div class="grow"><b>${it.studentId?esc(sName(it.studentId)):'Kart'} ${b[it.state]||''}</b><span class="muted">${esc(it.msg)}</span>
  ${it.state==='need'?`<select data-qitem="${it.id}"><option value="">Şagird seçin</option>${rosterArr().map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(gName(s.groupId))})</option>`).join('')}</select>`:''}
  ${it.resultId&&S.results.some(r=>r.id===it.resultId)?`<div class="acts" style="margin-top:6px"><button class="btn sm ghost" data-act="viewRes" data-id="${it.resultId}">Bax / düzəlt</button></div>`:''}</div></div>`).join('')}</section>`:''}`;
};
function resRow(r,i){const p=pctOf(r),un=(r.open||[]).filter(o=>o.unsure&&!o.edited).length;return `<div class="li click srow" data-act="viewRes" data-id="${r.id}"><span class="rank">${i+1}</span><div class="grow"><b>${esc(sName(r.studentId))}</b><small>Qapalı ${closedScore(r,examById(r.examId))} · Açıq ${openScore(r)}${un?` · <span style="color:var(--amber)">⚠ ${un} cavaba baxın</span>`:''}</small></div><span class="pct" style="color:${pctCol(p)}">${fmt(p)}</span></div>`}
VIEWS.neticeler=()=>{
  const gs=groupsSorted();if(!gs.length)return `<section class="box"><h2>Nəticələr</h2><p class="empty">Əvvəl Şagirdlər bölməsində qrup yaradın.</p></section>`;
  if(!groupById(rf.groupId))rf.groupId=gs[0].id;const g=rf.groupId;
  const exs=examsSorted().filter(e=>(e.groupIds||[]).includes(g)||S.results.some(r=>r.examId===e.id&&studentById(r.studentId)?.groupId===g));
  if(!exs.some(e=>e.id===rf.examId))rf.examId=exs[0]?.id||'';
  const flt=`<section class="box"><h2>Nəticələr</h2><div class="two"><div><label class="l" style="margin-top:0">Qrup</label><select data-bind="rf.groupId" data-rr="1">${gs.map(x=>`<option value="${x.id}"${x.id===g?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label class="l" style="margin-top:0">Sınaq</label><select data-bind="rf.examId" data-rr="1">${exs.length?exs.map(e=>`<option value="${e.id}"${e.id===rf.examId?' selected':''}>${esc(e.name)}${e.date?' ('+esc(e.date)+')':''}</option>`).join(''):'<option value="">Sınaq yoxdur</option>'}</select></div></div></section>`;
  const ex=examById(rf.examId);if(!ex)return flt;
  const rs=S.results.filter(r=>r.examId===ex.id&&studentById(r.studentId)?.groupId===g).sort((a,b)=>pctOf(b)-pctOf(a)),ab=absentOf(ex,g);
  const avg=rs.length?rs.reduce((a,r)=>a+pctOf(r),0)/rs.length:0;
  return flt+`<section class="box"><h2>${esc(ex.name)} <span class="muted" style="font-weight:500">${esc(gName(g))}</span></h2>${rs.length?`<p class="hint" style="margin-top:0">Orta bal: <b>${fmt(Math.round(avg*100)/100)}</b> / 100 · Bal = (qapalı düz + açıq xal) ÷ ${maxRaw(ex)} × 100</p>`:''}
  ${rs.length||ab.length?`<div class="list">${rs.map(resRow).join('')}${ab.map((st,k)=>`<div class="li"><span class="rank">${rs.length+k+1}</span><div class="grow"><b class="muted">${esc(st.name)}</b></div><span class="badge err">Yazmayıb</span></div>`).join('')}</div>`:'<p class="empty">Hələ nəticə yoxdur.</p>'}
  ${rs.length?`<div class="acts"><button class="btn wa" data-act="sendAll">📤 WhatsApp: hamısına göndər</button><button class="btn ghost" data-act="classImg">📸 Valideynlər üçün şəkil</button></div>`:''}</section>`;
};
VIEWS.res=()=>{
  const r=S.results.find(x=>x.id===rf.resId);if(!r)return `<button class="back" data-act="back">← Geri</button><div class="box empty">Nəticə tapılmadı.</div>`;
  const ex=examById(r.examId),st=studentById(r.studentId),cq=closedQs(ex),oq=openQs(ex),ph=waPhone(st?.phone),p=pctOf(r);
  return `<button class="back" data-act="back">← Geri</button>
  <section class="box"><div class="score" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="pen big" style="color:${pctCol(p)};border-color:${pctCol(p)}">${fmt(p)}</span><div><h2 style="margin:0">${esc(st?.name||'')}</h2><p class="muted" style="margin:0">${esc(ex?.name||'')} · ${esc(gName(st?.groupId))}<br>Qapalı ${closedScore(r,ex)}/${cq.length} · Açıq ${openScore(r)}/${oq.length*2} · ${rawOf(r)}/${maxRaw(ex)} xal</p></div></div>

  <section class="box"><h2>Qapalı suallar</h2><p class="hint" style="margin-top:0">Hərfə basaraq şagirdin cavabını düzəldə bilərsiniz.</p>${cq.map((q,i)=>{const v=(r.answers||[])[i]||'-',ok=v!=='-'&&String(q.key||'').includes(v);return `<div class="row"><span class="qn">${q.n}</span><div class="opts">${LETTERS.map(l=>`<button type="button" class="bub${v===l?' on':''}" data-act="resAns" data-id="${r.id}" data-i="${i}" data-v="${l}">${l}</button>`).join('')}</div><span class="mk ${ok?'ok':'bad'}">${ok?'✓':'✗'}${ok?'':`<span class="kh">${esc(q.key||'?')}</span>`}</span></div>`}).join('')}</section>
  <section class="box"><h2>Açıq suallar</h2>${(r.open||[]).map((o,k)=>{const q=oq.find(z=>z.n===o.n);return `<div class="crit" style="border-color:${o.score===2?'var(--ok)':o.score===1?'var(--amber)':'var(--pen)'}"><div class="tagrow"><b>${o.n}) ${esc(q?.hint||'')}</b><select data-rscore="${r.id}" data-k="${k}" style="width:auto;padding:5px 8px">${[2,1,0].map(v=>`<option value="${v}"${o.score===v?' selected':''}>${ptsTxt(v)}</option>`).join('')}</select></div>
    <div style="font-size:14.5px;margin:4px 0"><span class="muted">Cavab:</span> ${o.answer?esc(o.answer):'<i class="muted">boş</i>'}</div>${o.note?`<div class="muted" style="font-size:13.5px">💡 ${esc(o.note)}</div>`:''}
    ${o.extra?'<span class="badge ok">✅ açarda yoxdur, amma düzdür</span> ':''}${o.unsure&&!o.edited?'<span class="badge warn">⚠ Müəllim baxsın</span> ':''}${o.edited?'<span class="badge">✏️ müəllim düzəltdi</span>':''}</div>`}).join('')||'<p class="muted">Açıq sual yoxdur.</p>'}</section>

VIEWS.send=()=>{
  const ex=examById(rf.examId),g=rf.groupId;if(!ex)return `<button class="back" data-act="back">← Geri</button>`;
  const rs=S.results.filter(r=>r.examId===ex.id&&studentById(r.studentId)?.groupId===g).sort((a,b)=>azCmp(sName(a.studentId),sName(b.studentId)));
  const key=ex.id+'|'+g;if(SND.key!==key){SND.key=key;SND.sent=new Set()}
  return `<button class="back" data-act="back">← Geri</button><section class="box"><h2>📤 Hamısına göndər — ${esc(ex.name)}</h2><p class="hint" style="margin-top:0">Hər şagirdin yanındakı düyməni basın — WhatsApp açılır, göndərin və geri qayıdın. Göndərilənlər ✅ ilə işarələnir.</p>
  <div class="list">${rs.map((r,i)=>{const st=studentById(r.studentId),ph=waPhone(st?.phone);return `<div class="li"><span class="rank">${SND.sent.has(r.id)?'✅':i+1}</span><div class="grow"><b>${esc(st?.name||'')}</b><small>${fmt(pctOf(r))} / 100</small></div>${ph?`<a class="btn wa sm" data-sent="${r.id}" href="https://wa.me/${ph}?text=${encodeURIComponent(resMsg(r))}" target="_blank" rel="noopener">Göndər</a>`:'<span class="badge err">nömrə yoxdur</span>'}</div>`}).join('')}</div></section>`;
};

VIEWS.sinaqlar=()=>{
  if(XD){const d=XD,gs=groupsSorted(),cq=closedQs(d),oq=openQs(d);
    return `<button class="back" data-act="xClose">← Sınaqlar</button>

    <label class="l">Qruplar</label><div class="chips">${gs.map(g=>`<button type="button" class="chip${d.groupIds.includes(g.id)?' on':''}" data-act="xGroup" data-id="${g.id}">${esc(g.name)}</button>`).join('')||'<span class="muted">Qrup yoxdur</span>'}</div></section>
    <section class="box"><h2>1. Sualların PDF-i</h2><p class="hint" style="margin-top:0">Yalnız Azərbaycan dili sualları olan PDF-i (və ya səhifələrin şəkillərini) yükləyin. Suallar oxunur, qapalı/açıq suallar müəyyən edilir və cavab kartı avtomatik qurulur. Kartda nömrələmə 1-dən başlayır.</p>
    ${d.busy?`<div class="status"><span class="spin"></span>${esc(d.msg)}</div>`:d.qs?.length?`<div class="status ok" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="flex:1">✅ Suallar yüklənib: ${d.pages||'?'} səhifə · ${cq.length} qapalı, ${oq.length} açıq sual</span><label class="btn sm ghost" for="pk-qpdf">Yenidən yüklə</label></div>
    <div class="acts"><button class="btn" data-act="xPdf">📄 Cavab kartını PDF kimi yüklə</button><button class="btn ghost" data-act="xCard">👁 Kartı göstər</button><button class="btn ghost" data-act="xRefresh">🔄 Kartı yenilə</button></div><p class="hint" style="margin:6px 0 0">«Kartı yenilə» — kartın formasını (cədvəldə bütöv sütunlar, nömrəli xanalar, sətir sayı) tətbiqin ən son qaydalarına görə PDF-dəki suala uyğun yenidən qurur. Cavablar, meyarlar və nəticələr dəyişmir.</p>`:`<label class="shoot" for="pk-qpdf" style="width:100%">📄 Sualların PDF-ini yüklə<small>PDF və ya səhifələrin şəkilləri (istəsəniz cavablar faylı ilə birlikdə)</small></label>`}</section>
    ${d.qs?.length?`<section class="box"><h2>2. Qapalı sualların açarı</h2><p class="hint" style="margin-top:0">Hər sualın düzgün variantını seçin. Mötərizədə sualın PDF-dəki nömrəsi göstərilir.</p>
    ${cq.map(q=>`<div class="row"><span class="qn" style="width:auto;min-width:64px;text-align:left">${q.n} <small class="muted">(${esc(q.pdf)})</small></span><div class="opts">${LETTERS.map(l=>`<button type="button" class="bub${q.key===l?' on':''}" data-act="xKey" data-n="${q.n}" data-v="${l}">${l}</button>`).join('')}</div></div>`).join('')}
    <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:14px">Açarı mətn kimi yapışdır</summary><textarea rows="2" id="xPaste" placeholder="B D A C E ..." style="margin-top:8px"></textarea><div class="acts"><button class="btn sm ghost" data-act="xPaste">Tətbiq et</button></div></details></section>
    <section class="box"><h2>3. Açıq suallar</h2>
    ${d.akBusy?`<div class="status"><span class="spin"></span>${esc(d.akMsg||'Cavablar oxunur…')}</div>`:(()=>{const nk=oq.filter(q=>String(q.key||'').trim()).length;return nk?`<div class="status ok" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><span style="flex:1">✅ Doğru cavablar yüklənib (${nk}/${oq.length}). Aşağıda baxıb dəyişə bilərsiniz.</span><label class="btn sm ghost" for="pk-akey">Yenidən yüklə</label></div>`:`<label class="shoot" for="pk-akey" style="width:100%;margin-bottom:10px">📥 Doğru cavabların faylını yüklə<small>Word (.docx), PDF və ya şəkil — cavablar aşağıdakı xanalara avtomatik yazılır, hərf səhvləri düzəldilir. Sonra istədiyinizi dəyişə bilərsiniz.</small></label>`})()}
    <p class="hint" style="margin-top:0">Doğru cavabları (nümunələri) yazın — istəyə görə. Şagird fərqli, amma düzgün cavab yazsa, o da qəbul olunur və izah verilir. Kartdakı yer ölçüsünü və formasını burada dəyişə bilərsiniz.</p>
    ${oq.map(q=>{const l=q.lay||{};return `<div class="excard"><div class="tagrow"><b>${q.n} <small class="muted">(PDF-də ${esc(q.pdf)})</small></b><span class="badge">${l.type==='table'?'Cədvəl':l.type==='items'?'İşarəli sətirlər':'Sətirlər'} · ${({S:'kiçik',M:'orta',L:'böyük'})[l.size]||'orta'}</span></div><p style="font-size:14px;margin:6px 0 2px"><b>${esc(q.hint)}</b></p>
      <label class="l" style="margin-top:4px">Doğru cavab(lar)</label><textarea rows="${Math.min(8,Math.max(2,String(q.key||'').split('\n').length+1))}" data-oq="${q.n}" data-f="key">${esc(q.key||'')}</textarea>
      <div class="two" style="margin-top:6px"><div><label class="l" style="margin-top:0">Kartda forma</label><select data-oq="${q.n}" data-f="type">${[['lines','Sətirlər'],['items','İşarəli sətirlər'],['table','Cədvəl']].map(([v,t])=>`<option value="${v}"${l.type===v?' selected':''}>${t}</option>`).join('')}</select></div><div><label class="l" style="margin-top:0">Yer ölçüsü</label><select data-oq="${q.n}" data-f="size">${[['S','Kiçik'],['M','Orta'],['L','Böyük']].map(([v,t])=>`<option value="${v}"${l.size===v?' selected':''}>${t}</option>`).join('')}</select></div></div>
      ${l.type==='items'?`<label class="l">İşarələr (vergüllə)</label><input type="text" data-oq="${q.n}" data-f="items" value="${esc((l.items||[]).join(', '))}">`:''}
      ${l.type==='table'?`<label class="l">Sütun başlıqları ( | ilə ayırın)</label><input type="text" data-oq="${q.n}" data-f="cols" value="${esc((l.cols||[]).join(' | '))}"><label class="l">Sətir sayı</label><input type="number" min="1" max="5" data-oq="${q.n}" data-f="rows" value="${l.rows||2}">${(l.cols||[]).length?`<label class="l">Sütunların forması</label>${(l.cols||[]).map((c,k)=>`<div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:4px 0;font-size:14px"><b style="flex:1 1 100%">${esc(c)}</b><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-oqc="${q.n}" data-f="merge" data-k="${k}"${l.merge?.[k]?' checked':''}> Bütöv xana (sətirsiz)</label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-oqc="${q.n}" data-f="num" data-k="${k}"${l.num?.[k]?' checked':''}> Xanalar nömrəli (1., 2.)</label></div>`).join('')}`:''}`:''}
      <label class="l">Bu sualın meyarları (fayldan götürülür; boşdursa Parametrlərdəki ümumi meyarlar işləyir)</label><textarea rows="${Math.min(8,Math.max(2,String(q.crit||'').split('\n').length+1))}" data-oq="${q.n}" data-f="crit">${esc(q.crit||'')}</textarea>
      <label class="l">Kartdakı başlıq (PDF-dəki tapşırıq mətni)</label><textarea rows="2" data-oq="${q.n}" data-f="hint">${esc(q.hint)}</textarea></div>`}).join('')}
    <label class="l">Bu sınaq üçün əlavə qaydalar (istəyə görə)</label><textarea rows="2" data-bind="XD.rules">${esc(d.rules||'')}</textarea></section>`:''}
    <div class="savebar"><div class="grow">${d.qs?.length?`<button class="btn ghost sm" data-act="xCard">👁 Kartı göstər</button>`:'<span class="muted">Əvvəl PDF-i yükləyin.</span>'}</div>${d.id?`<button class="btn danger" data-act="xDel">Sil</button>`:''}<button class="btn" data-act="xSave">Yadda saxla</button></div>`}
  const list=examsSorted();
  return `<section class="box"><h2>Sınaqlar</h2><div class="acts" style="margin-top:0"><button class="btn" data-act="xNew">➕ Yeni sınaq yarat</button></div></section>
  <section class="box"><h2>Hazır sınaqlar</h2>${list.length?`<div class="list">${list.map(e=>`<div class="li click" data-act="xOpen" data-id="${e.id}"><div class="grow"><b>${esc(e.name)}</b><small>${esc(e.date||'')} · ${closedQs(e).length} qapalı, ${openQs(e).length} açıq · ${exGroups(e).map(gName).map(esc).join(', ')||'—'} · ${S.results.filter(r=>r.examId===e.id).length} nəticə</small></div><button class="btn sm ghost" data-act="card" data-id="${e.id}" style="padding:6px 10px">📄</button><span class="muted" style="font-size:20px">›</span></div>`).join('')}</div>`:'<p class="empty">Hələ sınaq yoxdur.</p>'}</section>`;
};
VIEWS.parametrler=()=>{
  if(!setDraft)setDraft={...S.settings,rubric:S.settings.rubric||DEFAULT_RUBRIC};const d=setDraft;
  return `<section class="box"><h2>Müəllim</h2><label class="l">Adınız</label><input type="text" data-bind="setDraft.teacherName" value="${esc(d.teacherName)}">
  <label class="l">Kartdakı loqo</label><input type="text" data-bind="setDraft.logo" value="${esc(d.logo||'')}" maxlength="6" placeholder="S.B.">
  <label class="l">WhatsApp mesajının sonunda imza</label><input type="text" data-bind="setDraft.sign" value="${esc(d.sign||'')}" placeholder="${esc(d.teacherName||'Adınız')}"></section>
  <section class="box"><h2>Açıq sualların qiymətləndirmə meyarları</h2><p class="hint">Açıq suallar bu meyarlara (bal şkalasına) görə yoxlanılır. Dəyişsəniz, yeni yoxlamalar yeni mətnlə aparılacaq.</p>
  <textarea rows="18" data-bind="setDraft.rubric">${esc(d.rubric)}</textarea><div class="acts"><button class="btn ghost sm" data-act="rubricReset">Standart meyarları qaytar</button></div>
  <p class="hint">Bal: qapalı sual 1 xal, açıq sual 2 xal (yarım bal = 1 xal). Nəticə = xal ÷ (qapalı sayı + 2 × açıq sayı) × 100.</p></section>
  <section class="box"><h2>Ehtiyat nüsxə</h2><div class="acts"><button class="btn ghost" data-act="exportJson">JSON yüklə</button><label class="btn ghost" style="position:relative">JSON-dan bərpa et<input type="file" accept=".json,application/json" data-file="import" style="position:absolute;inset:0;opacity:0"></label></div></section>
  <div class="savebar"><div class="grow muted">Dəyişiklikləri saxlamağı unutmayın.</div><button class="btn" data-act="saveSet">Yadda saxla</button></div>`;
};

/* ---------- actions ---------- */
const ACT={
  go:el=>go(el.dataset.to),
  back:()=>{tab=prevTab;render();toTop()},
  card:el=>showCard(examById(el.dataset.id)),
  resume:()=>runQueue(),
  toRes:el=>{const e=examById(el.dataset.id);rf.examId=e.id;rf.groupId=Q.groupId||exGroups(e)[0]||'';go('neticeler')},
  viewRes:el=>{rf.resId=el.dataset.id;prevTab=tab==='res'?prevTab:tab;tab='res';pushNav();render();toTop()},
  async delRes(el){if(!await confirmBox('Nəticə silinsin?',sName(S.results.find(r=>r.id===el.dataset.id)?.studentId)))return;await del('results',el.dataset.id);tab=prevTab;render()},
  async resAns(el){const r=S.results.find(x=>x.id===el.dataset.id);if(!r)return;const a=(r.answers||[]).slice(),i=Number(el.dataset.i),v=el.dataset.v;a[i]=a[i]===v?'-':v;await put('results',{...r,answers:a,updated:new Date().toISOString()});render()},
  sendAll:()=>{tab='send';pushNav();render();toTop()},
  classImg(){const ex=examById(rf.examId),g=rf.groupId;if(!ex)return;const rs=S.results.filter(r=>r.examId===ex.id&&studentById(r.studentId)?.groupId===g).sort((a,b)=>pctOf(b)-pctOf(a));try{shareImage(classImage(ex,g,rs,absentOf(ex,g)),(ex.name+'-'+gName(g)).replace(/[^\p{L}\p{N}]+/gu,'-')+'.png','','')}catch(e){toast('Şəkil hazırlanmadı.','err')}},
  async addGroup(){const n=forms.group.trim();if(!n)return toast('Qrupun adını yazın.','err');const g={id:newId(),name:n};await put('groups',g);forms.group='';forms.sGroup=g.id;render()},
  async renameGroup(el){const g=groupById(el.dataset.id);if(!g)return;const v=await modal({title:'Qrupun adı',fields:[{label:'Ad',value:g.name}]});if(v&&v[0])await put('groups',{...g,name:v[0]});render()},
  async delGroup(el){const g=groupById(el.dataset.id);if(!g)return;const st=studentsOf(g.id);if(!await confirmBox('Qrup silinsin?',`${g.name} və onun ${st.length} şagirdi (nəticələri ilə) silinəcək.`))return;for(const s of st){for(const r of S.results.filter(r=>r.studentId===s.id))await del('results',r.id);await del('students',s.id)}await del('groups',g.id);render()},
  async delStudent(el){const s=studentById(el.dataset.id);if(!s)return;const rs=S.results.filter(r=>r.studentId===s.id);if(!await confirmBox('Şagird silinsin?',`${s.name} və onun ${rs.length} nəticəsi silinəcək.`))return;for(const r of rs)await del('results',r.id);await del('students',s.id);render()},
  stuEdit:el=>{const id=el.dataset.id;if(stuEdit.has(id))stuEdit.delete(id);else stuEdit.add(id);openGrp.add(id);render()},
  addRow:()=>{forms.rows.push({name:'',phone:''});render()},
  async addStudents(){const g=forms.sGroup;if(!groupById(g))return toast('Qrupu seçin.','err');const list=forms.rows.filter(r=>r.name.trim()).map(r=>({name:r.name.trim(),phone:r.phone.trim()}));
    forms.bulk.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const m=l.split(/[,;\t]/);list.push({name:m[0].trim(),phone:(m[1]||'').trim()})});
    if(!list.length)return toast('Ən azı bir şagirdin adını yazın.','err');for(const s of list)await put('students',{id:newId(),groupId:g,name:s.name,phone:s.phone});
    forms.rows=[{name:'',phone:''},{name:'',phone:''},{name:'',phone:''}];forms.bulk='';openGrp.add(g);toast(list.length+' şagird əlavə olundu.');render()},
  xNew:()=>{XD={id:'',name:'',date:today(),groupIds:Q.groupId&&groupById(Q.groupId)?[Q.groupId]:[],qs:[],trans:'',pages:0,rules:'',busy:false,msg:''};pushNav();render();toTop()},
  xOpen:el=>{const e=examById(el.dataset.id);if(!e)return;XD={...clean(e),busy:false,msg:''};pushNav();render();toTop()},
  xClose:()=>{XD=null;render();toTop()},
  xGroup:el=>{const id=el.dataset.id,a=XD.groupIds;XD.groupIds=a.includes(id)?a.filter(x=>x!==id):a.concat(id);render()},
  xKey:el=>{const q=XD.qs.find(z=>z.n===Number(el.dataset.n));if(q){q.key=q.key===el.dataset.v?'':el.dataset.v;render()}},
  xPaste(){const t=($('#xPaste')?.value||'').toUpperCase().match(/[A-E]/g)||[];const cq=closedQs(XD);cq.forEach((q,i)=>{if(t[i])q.key=t[i]});toast(Math.min(t.length,cq.length)+' cavab yazıldı.');render()},
  xCard(){showCard(XD)},
  async xRefresh(){const n=refreshLayout(XD);if(!n){toast('Bu sınaqda yenilənəsi cədvəl tapılmadı. Formanı aşağıda əl ilə dəyişə bilərsiniz.');return}
    if(XD.id){const e=examById(XD.id);if(e){try{await put('exams',{...e,qs:clean(XD.qs)})}catch(err){return}}}toast(n+' cədvəl yeniləndi'+(XD.id?' və saxlandı.':'. «Yadda saxla» basın.'));render();showCard(XD)},
  xPdf(){downloadCard(XD)},
  async xSave(){const d=XD;if(!d.name.trim())return toast('Sınağın adını yazın.','err');if(!(d.qs||[]).length)return toast('Əvvəl sualların PDF-ini yükləyin.','err');
    const e={id:d.id||newId(),name:d.name.trim(),date:d.date||today(),groupIds:d.groupIds,qs:d.qs,trans:d.trans,pages:d.pages||0,rules:d.rules||'',created:d.created||new Date().toISOString()};
    try{await put('exams',e)}catch(err){return}XD={...clean(e),busy:false,msg:''};Q.examId=e.id;toast('Sınaq saxlandı.'+(closedQs(e).some(q=>!q.key)?' Bəzi açarlar boşdur.':''));render()},
  async xDel(){const e=examById(XD.id);if(!e)return;const rs=S.results.filter(r=>r.examId===e.id);if(!await confirmBox('Sınaq silinsin?',`«${e.name}»${rs.length?' və '+rs.length+' nəticə':''} silinəcək.`))return;for(const r of rs)await del('results',r.id);await del('exams',e.id);XD=null;render()},
  async saveSet(){if(await saveSettings(setDraft)){setDraft=null;toast('Saxlandı.');render()}},
  rubricReset(){setDraft.rubric=DEFAULT_RUBRIC;render()},
  exportJson(){saveFile('azdili-ehtiyat-'+today()+'.json',new Blob([JSON.stringify({app:'AzDiliSinaq',version:1,groups:S.groups,students:S.students,exams:S.exams,results:S.results,settings:S.settings})],{type:'application/json'}))},
};
function setBind(path,val){const p=path.split('.');const roots={forms,rf,Q,XD,setDraft};let o=roots[p[0]];if(!o)return;for(let i=1;i<p.length-1;i++){o=o[p[i]];if(o==null)return}o[p[p.length-1]]=val}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){go(t.dataset.tab);return}
  const s=e.target.closest('[data-sent]');if(s){SND.sent.add(s.dataset.sent);setTimeout(render,300);return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&!e.target.closest('a[href]')){e.preventDefault();ACT[a.dataset.act](a,e)}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.grp')){if(d.open)openGrp.add(d.dataset.g);else openGrp.delete(d.dataset.g)}},true);
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind&&el.tagName!=='SELECT')setBind(el.dataset.bind,el.value);
  if(el.dataset.oq&&XD&&el.tagName!=='SELECT'){const q=XD.qs.find(z=>z.n===Number(el.dataset.oq));if(!q)return;const f=el.dataset.f;if(f==='key')q.key=el.value;else if(f==='crit')q.crit=el.value;else if(f==='hint')q.hint=el.value.slice(0,300);else if(f==='items')q.lay.items=el.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6);else if(f==='cols')q.lay.cols=el.value.split('|').map(x=>x.trim()).filter(Boolean).slice(0,5);else if(f==='rows')q.lay.rows=Math.max(1,Math.min(5,Number(el.value)||2))}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.sname||el.dataset.sphone){const s=studentById(el.dataset.sname||el.dataset.sphone);if(s){const f=el.dataset.sname?'name':'phone';const v=el.value.trim();if(f==='name'&&!v)return;await put('students',{...s,[f]:v})}return}
  if(el.dataset.qitem){const it=Q.items.find(x=>x.id===el.dataset.qitem);if(it&&el.value){try{await saveItem(it,el.value)}catch(err){}render()}return}
  if(el.dataset.rscore){const r=S.results.find(x=>x.id===el.dataset.rscore);if(!r)return;const open=clean(r.open||[]),k=Number(el.dataset.k);open[k].score=Number(el.value);open[k].edited=true;await put('results',{...r,open,updated:new Date().toISOString()});render();return}
  if(el.dataset.oqc&&XD){const q=XD.qs.find(z=>z.n===Number(el.dataset.oqc));if(q){const f=el.dataset.f,k=Number(el.dataset.k);const a=Array.isArray(q.lay[f])?q.lay[f].slice():[];while(a.length<=k)a.push(false);a[k]=el.checked;q.lay[f]=a}return}
  if(el.dataset.oq&&XD&&el.tagName==='SELECT'){const q=XD.qs.find(z=>z.n===Number(el.dataset.oq));if(q){q.lay[el.dataset.f]=el.value;render()}return}
  if(el.dataset.bind&&el.tagName==='SELECT'){setBind(el.dataset.bind,el.value);if(el.dataset.rr)render();return}
  if(!el.dataset.file)return;const files=[...(el.files||[])];el.value='';if(!files.length)return;const k=el.dataset.file;
  if(k==='sheet'){toast(files.length+' şəkil növbəyə əlavə olunur…');addToQueue(files)}
  else if(k==='qpdf'){if(XD)analyseExam(files)}
  else if(k==='akey'){if(XD)importAnswers(files)}
  else if(k==='import'){try{const v=JSON.parse(await files[0].text());if(v.app!=='AzDiliSinaq')return toast('Bu fayl bu tətbiqə aid deyil.','err');if(!await confirmBox('Bərpa edilsin?','Fayldakı məlumatlar əlavə olunacaq (eyni olanlar yenilənəcək).','Bərpa et'))return;for(const c of ['groups','students','exams','results'])for(const o of (v[c]||[]))await put(c,o);if(v.settings)await saveSettings({...S.settings,...v.settings});toast('Bərpa olundu.');render()}catch(err){toast('Fayl oxunmadı.','err')}}
});
initStore();render();

</script>
